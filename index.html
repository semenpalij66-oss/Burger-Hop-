function drawUI() {
    menuAnimTime += 0.04;

    if (gameState === STATES.SHOP) {
        ctx.fillStyle = '#322016';
        ctx.fillRect(0, 0, GAME_W, GAME_H);

        ctx.fillStyle = '#FFF0DB';
        ctx.fillRect(0, 0, GAME_W, 240);

        const stripeW = 25;
        for (let i = 0; i < 16; i++) {
            ctx.fillStyle = (i % 2 === 0) ? '#E53E3E' : '#FFFFFF';
            ctx.fillRect(i * stripeW, 0, stripeW, 35);
        }
        ctx.fillStyle = '#C53030';
        ctx.fillRect(0, 35, GAME_W, 6);

        ctx.fillStyle = '#5C3C28';
        ctx.beginPath();
        ctx.roundRect(GAME_W / 2 - 90, 48, 180, 32, 8);
        ctx.fill();
        ctx.strokeStyle = '#E8AB5F';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#FFF5E1';
        ctx.font = '900 16px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText("BURGER BAR", GAME_W / 2, 70);

        ctx.fillStyle = '#D4A373';
        ctx.fillRect(0, 180, GAME_W, 60);
        ctx.fillStyle = '#A67C52';
        ctx.fillRect(0, 180, GAME_W, 10);

        const displayY = 155 + Math.sin(menuAnimTime * 2.5) * 4;
        drawPlate(GAME_W / 2, 175, displayY);

        burger.draw(GAME_W / 2, displayY, false, previewSkin);

        ctx.fillStyle = '#2B1B12';
        ctx.fillRect(0, 240, GAME_W, 360);

        ctx.strokeStyle = 'rgba(232, 171, 95, 0.08)';
        ctx.lineWidth = 2;
        for (let i = -200; i < GAME_W + 360; i += 24) {
            ctx.beginPath();
            ctx.moveTo(i, 240);
            ctx.lineTo(i - 360, 600);
            ctx.stroke();
        }

        ctx.fillStyle = 'rgba(232, 171, 95, 0.15)';
        parallaxSeeds.forEach(seed => {
            const shopSeedY = 240 + ((seed.y + menuAnimTime * 15 * seed.speed) % 360);
            ctx.save();
            ctx.translate(seed.x, shopSeedY);
            ctx.rotate(seed.rot);
            ctx.beginPath();
            ctx.ellipse(0, 0, seed.size, seed.size * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        const grad = ctx.createRadialGradient(200, 420, 100, 200, 420, 250);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.4)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 240, GAME_W, 360);

        ctx.fillStyle = '#FFE0B2';
        ctx.font = '900 14px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText("★ SELECT YOUR SKIN ★", GAME_W / 2, 260);

        const pageSkins = skinKeys.filter(k => SKINS[k].page === shopPage);

        const cols = 4;
        const cardW = 78;
        const cardH = 80;
        const gapX = 14;
        const gapY = 12;
        const startX = 20;
        const startY = 275;

        pageSkins.forEach((key, index) => {
            const row = Math.floor(index / cols);
            const col = index % cols;
            const cx = startX + col * (cardW + gapX);
            const cy = startY + row * (cardH + gapY);

            const isUnlocked = unlockedSkins.includes(key);
            const isSelected = selectedSkin === key;
            const skinInfo = SKINS[key];

            ctx.fillStyle = '#FFF0D9';
            ctx.beginPath();
            ctx.roundRect(cx, cy, cardW, cardH, 10);
            ctx.fill();

            ctx.strokeStyle = isSelected ? '#D69E2E' : '#5C3C28';
            ctx.lineWidth = isSelected ? 3 : 2;
            ctx.stroke();

            burger.draw(cx + cardW / 2, cy + 30, false, key);

            if (isUnlocked) {
                ctx.fillStyle = isSelected ? '#2F855A' : '#4A5568';
                ctx.beginPath();
                ctx.roundRect(cx + 6, cy + 56, cardW - 12, 18, 5);
                ctx.fill();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = '900 8px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(isSelected ? 'EQUIPPED' : 'EQUIP', cx + cardW / 2, cy + 68);
            } else {
                const canAfford = money >= skinInfo.price;
                ctx.fillStyle = canAfford ? '#38A169' : '#E53E3E';
                ctx.beginPath();
                ctx.roundRect(cx + 6, cy + 56, cardW - 12, 18, 5);
                ctx.fill();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = '900 9px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(`$${skinInfo.price}`, cx + cardW / 2, cy + 68);

                // Маленькая кнопка "открыть за рекламу" в углу карточки
                ctx.fillStyle = '#3B82F6';
                ctx.beginPath();
                ctx.roundRect(cx + cardW - 24, cy + 3, 21, 14, 4);
                ctx.fill();
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '900 7px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('▶AD', cx + cardW - 13.5, cy + 12.5);
            }
        });

        // Пагинация
        const navY = 560;

        ctx.fillStyle = (shopPage > 1) ? '#E8AB5F' : '#64748B';
        ctx.beginPath();
        ctx.roundRect(startX, navY, 40, 26, 6);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 16px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText("<", startX + 20, navY + 18);

        ctx.fillStyle = '#FFF5E1';
        ctx.font = 'bold 13px Courier New';
        ctx.fillText(`PAGE ${shopPage} / 2`, GAME_W / 2, navY + 17);

        ctx.fillStyle = (shopPage < 2) ? '#E8AB5F' : '#64748B';
        ctx.beginPath();
        ctx.roundRect(GAME_W - startX - 40, navY, 40, 26, 6);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 16px Courier New';
        ctx.fillText(">", GAME_W - startX - 20, navY + 18);

        if (skinToConfirm) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, GAME_W, GAME_H);

            const mBoxW = 260;
            const mBoxH = 180;
            const mBoxX = (GAME_W - mBoxW) / 2;
            const mBoxY = (GAME_H - mBoxH) / 2;

            ctx.fillStyle = '#FFF5E6';
            ctx.beginPath();
            ctx.roundRect(mBoxX, mBoxY, mBoxW, mBoxH, 14);
            ctx.fill();
            ctx.strokeStyle = '#5C3C28';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#5C3C28';
            ctx.font = '900 16px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText("ARE YOU SURE?", GAME_W / 2, mBoxY + 32);

            ctx.font = 'bold 12px Courier New';
            ctx.fillText(`Buy skin for $${SKINS[skinToConfirm].price}?`, GAME_W / 2, mBoxY + 60);

            burger.draw(GAME_W / 2, mBoxY + 95, false, skinToConfirm);

            ctx.fillStyle = '#38A169';
            ctx.beginPath();
            ctx.roundRect(mBoxX + 20, mBoxY + 125, 100, 36, 8);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '900 14px Courier New';
            ctx.fillText("YES", mBoxX + 70, mBoxY + 148);

            ctx.fillStyle = '#E53E3E';
            ctx.beginPath();
            ctx.roundRect(mBoxX + 140, mBoxY + 125, 100, 36, 8);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText("NO", mBoxX + 190, mBoxY + 148);
        }
    }

    ctx.fillStyle = '#FFF0D9';
    ctx.beginPath();
    ctx.roundRect(GAME_W - 110, 12, 98, 26, 8);
    ctx.fill();
    ctx.strokeStyle = '#D4A373';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = music.isMuted ? '#E53E3E' : '#2F855A';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(music.isMuted ? 'MUSIC: OFF' : 'MUSIC: ON', GAME_W - 61, 29);

    if (gameState !== STATES.START) {
        drawMoneyUI();
    }

    if (gameState === STATES.SHOP || gameState === STATES.PLAYING || gameState === STATES.READY) {
        drawExitButton();
    }

    if (gameState === STATES.READY) {
        drawShopIcon(GAME_W - 160, 10);
    }

    if (gameState === STATES.PLAYING) {
        drawPauseButton();
    }

    if (gameState === STATES.PLAYING || gameState === STATES.READY || gameState === STATES.PAUSED || gameState === STATES.RESUMING) {
        ctx.fillStyle = '#4A3728';
        ctx.font = '900 42px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(score, GAME_W / 2, 70);
    }

    if (gameState === STATES.READY) {
        const pulse = (Math.sin(menuAnimTime * 4) + 1) / 2;

        ctx.fillStyle = '#FFF0D9';
        ctx.beginPath();
        ctx.roundRect(GAME_W / 2 - 130, 200, 260, 45, 12);
        ctx.fill();
        ctx.strokeStyle = '#D4A373';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = `rgba(92, 60, 40, ${0.5 + pulse * 0.5})`;
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText("PRESS SPACE OR TAP", GAME_W / 2, 220);
        ctx.fillText("TO JUMP & START", GAME_W / 2, 235);
    }

    if (gameState === STATES.START) {
        const burgerY = 250 + Math.sin(menuAnimTime * 1.5) * 10;
        const bannerY = 145 + Math.cos(menuAnimTime * 1.2) * 6;

        ctx.save();
        ctx.translate(GAME_W / 2, 75);

        ctx.fillStyle = 'rgba(74, 55, 40, 0.15)';
        ctx.beginPath();
        ctx.roundRect(-155, -30, 310, 68, 16);
        ctx.fill();

        ctx.fillStyle = '#5C3C28';
        ctx.beginPath();
        ctx.roundRect(-160, -35, 320, 68, 16);
        ctx.fill();
        ctx.strokeStyle = '#E8AB5F';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.font = '900 32px Courier New, monospace';
        ctx.textAlign = 'center';

        ctx.fillStyle = '#381C10';
        ctx.fillText("BURGER HOP", 3, 11);
        ctx.fillStyle = '#D99B52';
        ctx.fillText("BURGER HOP", 1, 9);
        ctx.fillStyle = '#FFF5E1';
        ctx.fillText("BURGER HOP", -1, 7);

        ctx.restore();

        ctx.save();
        ctx.translate(GAME_W / 2, bannerY);
        ctx.rotate(Math.sin(menuAnimTime * 0.8) * 0.04);

        ctx.fillStyle = '#E53E3E';
        ctx.beginPath();
        ctx.roundRect(-115, -14, 230, 28, 8);
        ctx.fill();
        ctx.strokeStyle = '#FFF5E1';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText("★ KITCHEN BREAKOUT ★", 0, 4);
        ctx.restore();

        ctx.fillStyle = 'rgba(232, 171, 95, 0.25)';
        ctx.beginPath();
        ctx.arc(GAME_W / 2, burgerY, 45, 0, Math.PI * 2);
        ctx.fill();

        burger.draw(GAME_W / 2, burgerY);

        ctx.fillStyle = '#FFF0D9';
        ctx.beginPath();
        ctx.roundRect(GAME_W / 2 - 85, 320, 170, 32, 10);
        ctx.fill();
        ctx.strokeStyle = '#C49A70';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#5C3C28';
        ctx.font = 'bold 13px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(`BEST SCORE: ${highScore}`, GAME_W / 2, 340);

        const btnW = 230;
        const btnH = 62;
        const btnX = (GAME_W - btnW) / 2;
        const btnY = 385;

        const scale = 1 + Math.sin(menuAnimTime * 2.5) * 0.02;

        ctx.save();
        ctx.translate(GAME_W / 2, btnY + btnH / 2);
        ctx.scale(scale, scale);
        ctx.translate(-GAME_W / 2, -(btnY + btnH / 2));

        ctx.fillStyle = '#2F855A';
        ctx.beginPath();
        ctx.roundRect(btnX, btnY + 6, btnW, btnH, 16);
        ctx.fill();

        ctx.fillStyle = '#48BB78';
        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 16);
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 26px Courier New, monospace';
        ctx.textAlign = 'center';
        ctx.fillText("PLAY NOW ▶", GAME_W / 2, btnY + 40);

        ctx.restore();
    } 
    else if (gameState === STATES.GAMEOVER) {
        ctx.fillStyle = 'rgba(43, 30, 23, 0.75)';
        ctx.fillRect(0, 0, GAME_W, GAME_H);

        const boxW = 290;
        const boxH = 400;
        const boxX = (GAME_W - boxW) / 2;
        const boxY = (GAME_H - boxH) / 2;

        ctx.fillStyle = '#FFF5E6';
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxW, boxH, 16);
        ctx.fill();
        ctx.strokeStyle = '#5C3C28';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#E53E3E';
        ctx.font = '900 28px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText("GAME OVER", GAME_W / 2, boxY + 48);

        burger.draw(GAME_W / 2, boxY + 100, true);

        ctx.fillStyle = '#FFF0D9';
        ctx.beginPath();
        ctx.roundRect(boxX + 25, boxY + 145, boxW - 50, 85, 10);
        ctx.fill();
        ctx.strokeStyle = '#D99B52';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#5C3C28';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'left';
        ctx.fillText("Score:", boxX + 45, boxY + 175);
        ctx.fillText("Best Score:", boxX + 45, boxY + 208);

        ctx.fillStyle = '#D99B52';
        ctx.font = '900 20px Courier New';
        ctx.textAlign = 'right';
        ctx.fillText(score, boxX + boxW - 45, boxY + 175);
        ctx.fillText(highScore, boxX + boxW - 45, boxY + 208);

        // --- Кнопка "возродиться за рекламу" (максимум MAX_REVIVES раз за заход) ---
        const revivesLeft = MAX_REVIVES - revivesUsedThisRun;
        ctx.beginPath();
        ctx.roundRect(boxX + 35, boxY + 250, boxW - 70, 50, 12);
        ctx.fillStyle = revivesLeft > 0 ? '#3B82F6' : '#94A3B8';
        ctx.fill();
        ctx.strokeStyle = revivesLeft > 0 ? '#FFFFFF' : '#CBD5E1';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 15px Courier New';
        ctx.textAlign = 'center';
        if (revivesLeft > 0) {
            ctx.fillText("▶ REVIVE FOR AD", GAME_W / 2, boxY + 271);
            ctx.font = 'bold 11px Courier New';
            ctx.fillText(`${revivesUsedThisRun}/${MAX_REVIVES} used this run`, GAME_W / 2, boxY + 288);
        } else {
            ctx.fillText("NO REVIVES LEFT", GAME_W / 2, boxY + 271);
            ctx.font = 'bold 11px Courier New';
            ctx.fillText(`${MAX_REVIVES}/${MAX_REVIVES} used - try again`, GAME_W / 2, boxY + 288);
        }

        ctx.fillStyle = '#48BB78';
        ctx.beginPath();
        ctx.roundRect(boxX + 35, boxY + 315, boxW - 70, 50, 12);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 20px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText("TRY AGAIN ↻", GAME_W / 2, boxY + 347);
    }
    else if (gameState === STATES.PAUSED) {
        ctx.fillStyle = 'rgba(43, 30, 23, 0.82)';
        ctx.fillRect(0, 0, GAME_W, GAME_H);

        const boxW = 280;
        const boxH = 420;
        const boxX = (GAME_W - boxW) / 2;
        const boxY = (GAME_H - boxH) / 2;
        const pulse = (Math.sin(menuAnimTime * 3) + 1) / 2;

        // тень панели
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.roundRect(boxX + 4, boxY + 6, boxW, boxH, 20);
        ctx.fill();

        // сама панель
        ctx.fillStyle = '#FFF5E6';
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxW, boxH, 20);
        ctx.fill();
        ctx.strokeStyle = '#5C3C28';
        ctx.lineWidth = 4;
        ctx.stroke();

        // полосатая "закусочная" шапка (обрезана по скруглению верха панели)
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxW, boxH, 20);
        ctx.clip();
        const stripeW = 20;
        for (let i = 0; i < Math.ceil(boxW / stripeW) + 1; i++) {
            ctx.fillStyle = (i % 2 === 0) ? '#E53E3E' : '#FFFFFF';
            ctx.fillRect(boxX + i * stripeW, boxY, stripeW, 28);
        }
        ctx.fillStyle = '#C53030';
        ctx.fillRect(boxX, boxY + 28, boxW, 5);
        ctx.restore();

        // деревянная табличка "PAUSED"
        ctx.fillStyle = '#5C3C28';
        ctx.beginPath();
        ctx.roundRect(GAME_W / 2 - 95, boxY + 42, 190, 40, 10);
        ctx.fill();
        ctx.strokeStyle = '#E8AB5F';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#FFF5E1';
        ctx.font = '900 20px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText("★ PAUSED ★", GAME_W / 2, boxY + 68);

        // бургер на тарелочке, покачивается
        const burgerBobY = boxY + 128 + Math.sin(menuAnimTime * 2.5) * 4;
        drawPlate(GAME_W / 2, boxY + 138, burgerBobY);
        burger.draw(GAME_W / 2, burgerBobY, false, selectedSkin);

        // --- Кнопки (объёмные, с "тенью" снизу как у PLAY NOW) ---
        function drawPauseMenuButton(y, h, topColor, label, subLabel, enabled, scale) {
            const bx = boxX + 20, bw = boxW - 40;
            ctx.save();
            if (scale && scale !== 1) {
                ctx.translate(GAME_W / 2, y + h / 2);
                ctx.scale(scale, scale);
                ctx.translate(-GAME_W / 2, -(y + h / 2));
            }
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.roundRect(bx, y + 5, bw, h, 12);
            ctx.fill();

            ctx.fillStyle = enabled ? topColor : '#94A3B8';
            ctx.beginPath();
            ctx.roundRect(bx, y, bw, h, 12);
            ctx.fill();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '900 15px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(label, GAME_W / 2, y + (subLabel ? h / 2 - 1 : h / 2 + 5));
            if (subLabel) {
                ctx.font = 'bold 10px Courier New';
                ctx.fillText(subLabel, GAME_W / 2, y + h / 2 + 15);
            }
            ctx.restore();
        }

        const btnH = 46;
        const gap = 12;
        let by = boxY + 195;

        drawPauseMenuButton(by, btnH, '#48BB78', "▶ RESUME", null, true, 1 + pulse * 0.03);
        by += btnH + gap;

        const coinCooldownLeft = COIN_AD_COOLDOWN - (Date.now() - lastCoinAdTime);
        if (coinCooldownLeft > 0) {
            const mins = Math.floor(coinCooldownLeft / 60000);
            const secs = Math.floor((coinCooldownLeft % 60000) / 1000);
            drawPauseMenuButton(by, btnH, '#3B82F6', `⏱ READY IN ${mins}:${secs.toString().padStart(2, '0')}`, "watch again soon", false);
        } else {
            drawPauseMenuButton(by, btnH, '#3B82F6', "▶ WATCH AD: +$25", "get free coins", true);
        }
        by += btnH + gap;

        drawPauseMenuButton(by, btnH, '#E53E3E', "EXIT TO MENU", null, true);
        by += btnH + gap;

        ctx.fillStyle = '#8A6A4E';
        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText("Press P or ESC to resume", GAME_W / 2, boxY + boxH - 14);
    }
    else if (gameState === STATES.RESUMING) {
        ctx.fillStyle = 'rgba(43, 30, 23, 0.55)';
        ctx.fillRect(0, 0, GAME_W, GAME_H);

        const elapsed = Date.now() - resumeCountdownStart;
        let label = "3";
        if (elapsed < 800) label = "3";
        else if (elapsed < 1600) label = "2";
        else if (elapsed < 2400) label = "1";
        else label = "JUMP!";

        const pop = 1 + Math.sin(Math.min(elapsed % 800, 400) / 400 * Math.PI) * 0.15;

        ctx.save();
        ctx.translate(GAME_W / 2, GAME_H / 2);
        ctx.scale(pop, pop);
        ctx.fillStyle = '#FFF5E1';
        ctx.font = '900 56px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#5C3C28';
        ctx.lineWidth = 5;
        ctx.strokeText(label, 0, 0);
        ctx.fillText(label, 0, 0);
        ctx.restore();
        ctx.textBaseline = 'alphabetic';
    }
}

// ============================================================================
//  НАВЕДЕНИЕ КУРСОРА НА КНОПКИ (только для мыши/ПК)
//  Функция read-only: просто повторяет те же условия попадания, что и
//  handleInput ниже, но ничего не меняет - только возвращает прямоугольник
//  кнопки под курсором (или null), чтобы поменять курсор и подсветить кнопку.
// ============================================================================
function getHoveredButton(mx, my) {
    if (gameState === STATES.RESUMING) return null;

    if (mx >= GAME_W - 110 && mx <= GAME_W - 12 && my >= 12 && my <= 38) {
        return { id: 'mute', x: GAME_W - 110, y: 12, w: 98, h: 26 };
    }

    if (gameState === STATES.PLAYING && mx >= GAME_W - 110 && mx <= GAME_W - 12 && my >= 44 && my <= 70) {
        return { id: 'pause', x: GAME_W - 110, y: 44, w: 98, h: 26 };
    }

    if (gameState === STATES.PAUSED) {
        const boxW = 280, boxH = 420;
        const boxX = (GAME_W - boxW) / 2;
        const boxY = (GAME_H - boxH) / 2;
        const bx = boxX + 20, bw = boxW - 40;
        const btnH = 46, gap = 12;
        let by = boxY + 195;

        if (mx >= bx && mx <= bx + bw) {
            if (my >= by && my <= by + btnH) return { id: 'resume', x: bx, y: by, w: bw, h: btnH };
            by += btnH + gap;
            if (my >= by && my <= by + btnH) return { id: 'watchAd', x: bx, y: by, w: bw, h: btnH };
            by += btnH + gap;
            if (my >= by && my <= by + btnH) return { id: 'toMenu', x: bx, y: by, w: bw, h: btnH };
        }
        return null;
    }

    if ((gameState === STATES.SHOP || gameState === STATES.PLAYING || gameState === STATES.READY) &&
        mx >= 12 && mx <= 54 && my >= 12 && my <= 44) {
        return { id: 'back', x: 12, y: 12, w: 42, h: 32 };
    }

    if (gameState === STATES.READY && mx >= GAME_W - 160 && mx <= GAME_W - 118 && my <= 45) {
        return { id: 'shopIcon', x: GAME_W - 160, y: 0, w: 42, h: 45 };
    }

    if (gameState === STATES.SHOP) {
        if (skinToConfirm) {
            const mBoxW = 260, mBoxH = 180;
            const mBoxX = (GAME_W - mBoxW) / 2;
            const mBoxY = (GAME_H - mBoxH) / 2;

            if (mx >= mBoxX + 20 && mx <= mBoxX + 120 && my >= mBoxY + 125 && my <= mBoxY + 161) {
                return { id: 'confirmYes', x: mBoxX + 20, y: mBoxY + 125, w: 100, h: 36 };
            }
            if (mx >= mBoxX + 140 && mx <= mBoxX + 240 && my >= mBoxY + 125 && my <= mBoxY + 161) {
                return { id: 'confirmNo', x: mBoxX + 140, y: mBoxY + 125, w: 100, h: 36 };
            }
            return null;
        }

        const navY = 560, startX = 20;
        if (my >= navY && my <= navY + 26) {
            if (mx >= startX && mx <= startX + 40 && shopPage > 1) {
                return { id: 'shopPrev', x: startX, y: navY, w: 40, h: 26 };
            }
            if (mx >= GAME_W - startX - 40 && mx <= GAME_W - startX && shopPage < 2) {
                return { id: 'shopNext', x: GAME_W - startX - 40, y: navY, w: 40, h: 26 };
            }
        }

        const pageSkins = skinKeys.filter(k => SKINS[k].page === shopPage);
        const cols = 4, cardW = 78, cardH = 80, gapX = 14, gapY = 12, startY = 275;

        for (let index = 0; index < pageSkins.length; index++) {
            const key = pageSkins[index];
            const row = Math.floor(index / cols);
            const col = index % cols;
            const cx = startX + col * (cardW + gapX);
            const cy = startY + row * (cardH + gapY);

            if (mx >= cx && mx <= cx + cardW && my >= cy && my <= cy + cardH) {
                const isUnlocked = unlockedSkins.includes(key);

                if (!isUnlocked && mx >= cx + cardW - 24 && mx <= cx + cardW - 3 && my >= cy + 3 && my <= cy + 17) {
                    return { id: 'unlockAd-' + key, x: cx + cardW - 24, y: cy + 3, w: 21, h: 14 };
                }

                const btnX = cx + 6, btnY = cy + 56, btnW = cardW - 12, btnH = 18;
                if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
                    return { id: 'skinBtn-' + key, x: btnX, y: btnY, w: btnW, h: btnH };
                }
                return null;
            }
        }
        return null;
    }

    if (gameState === STATES.START) {
        const btnW = 230, btnH = 62;
        const btnX = (GAME_W - btnW) / 2, btnY = 385;
        if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
            return { id: 'play', x: btnX, y: btnY, w: btnW, h: btnH };
        }
        return null;
    }

    if (gameState === STATES.GAMEOVER) {
        const boxW = 290, boxH = 400;
        const boxX = (GAME_W - boxW) / 2, boxY = (GAME_H - boxH) / 2;

        const reviveX = boxX + 35, reviveY = boxY + 250, reviveW = boxW - 70, reviveH = 50;
        if (mx >= reviveX && mx <= reviveX + reviveW && my >= reviveY && my <= reviveY + reviveH) {
            return { id: 'revive', x: reviveX, y: reviveY, w: reviveW, h: reviveH };
        }

        const btnX = boxX + 35, btnY = boxY + 315, btnW = boxW - 70, btnH = 50;
        if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
            return { id: 'retry', x: btnX, y: btnY, w: btnW, h: btnH };
        }
        return null;
    }

    return null;
}

let hoveredButton = null;

function drawButtonHover() {
    if (!hoveredButton) return;
    // Пульсирующая золотистая обводка с мягким свечением поверх кнопки под курсором
    const t = performance.now() / 1000;
    const pulse = 0.55 + Math.sin(t * 6) * 0.2;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = '#FFE066';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(255, 209, 102, 0.9)';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.roundRect(hoveredButton.x - 3, hoveredButton.y - 3, hoveredButton.w + 6, hoveredButton.h + 6, 10);
    ctx.stroke();
    ctx.restore();
}

function handleInput(e) {
    music.start();

    if (e && e.clientX !== undefined) {
        const rect = canvas.getBoundingClientRect();
        // Канвас теперь растянут на весь экран, а вся игровая логика
        // по-прежнему работает в логических координатах 0..GAME_W/0..GAME_H,
        // поэтому переводим координаты клика/тапа именно в эту систему.
        const scaleX = GAME_W / rect.width;
        const scaleY = GAME_H / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        // Пока идёт отсчёт "3..2..1..Jump!" - клики игнорируем
        if (gameState === STATES.RESUMING) {
            return;
        }

        if (clickX >= GAME_W - 110 && clickX <= GAME_W - 12 && clickY >= 12 && clickY <= 38) {
            music.toggleMute();
            return;
        }

        if (gameState === STATES.PLAYING && clickX >= GAME_W - 110 && clickX <= GAME_W - 12 && clickY >= 44 && clickY <= 70) {
            pauseGame();
            return;
        }

        if (gameState === STATES.PAUSED) {
            const boxW = 280;
            const boxH = 420;
            const boxX = (GAME_W - boxW) / 2;
            const boxY = (GAME_H - boxH) / 2;
            const bx = boxX + 20, bw = boxW - 40;
            const btnH = 46, gap = 12;
            let by = boxY + 195;

            if (clickX >= bx && clickX <= bx + bw) {
                if (clickY >= by && clickY <= by + btnH) {
                    resumeGameFromPause();
                    return;
                }
                by += btnH + gap;
                if (clickY >= by && clickY <= by + btnH) {
                    if (Date.now() - lastCoinAdTime >= COIN_AD_COOLDOWN) {
                        showRewardedAd(() => {
                            money += 25;
                            lastCoinAdTime = Date.now();
                            localStorage.setItem('burger_money', money);
                            music.playCoinSFX();
                        }, 'coins-bonus');
                    }
                    return;
                }
                by += btnH + gap;
                if (clickY >= by && clickY <= by + btnH) {
                    gameState = STATES.START;
                    previewSkin = selectedSkin;
                    return;
                }
            }
            return;
        }

        if ((gameState === STATES.SHOP || gameState === STATES.PLAYING || gameState === STATES.READY) && 
            clickX >= 12 && clickX <= 54 && clickY >= 12 && clickY <= 44) {
            gameState = STATES.START;
            previewSkin = selectedSkin;
            return;
        }

        if (gameState === STATES.READY && clickX >= GAME_W - 160 && clickX <= GAME_W - 118 && clickY <= 45) {
            gameState = STATES.SHOP;
            previewSkin = selectedSkin;
            return;
        }

        if (gameState === STATES.SHOP) {
            if (skinToConfirm) {
                const mBoxW = 260;
                const mBoxH = 180;
                const mBoxX = (GAME_W - mBoxW) / 2;
                const mBoxY = (GAME_H - mBoxH) / 2;

                const skinInfo = SKINS[skinToConfirm];

                if (clickX >= mBoxX + 20 && clickX <= mBoxX + 120 && clickY >= mBoxY + 125 && clickY <= mBoxY + 161) {
                    if (money >= skinInfo.price) {
                        money -= skinInfo.price;
                        unlockedSkins.push(skinToConfirm);
                        selectedSkin = skinToConfirm;
                        previewSkin = skinToConfirm;

                        localStorage.setItem('burger_money', money);
                        localStorage.setItem('burger_unlocked_skins', JSON.stringify(unlockedSkins));
                        localStorage.setItem('burger_skin', selectedSkin);

                        music.playCoinSFX();
                    }
                    skinToConfirm = null;
                    return;
                }

                if (clickX >= mBoxX + 140 && clickX <= mBoxX + 240 && clickY >= mBoxY + 125 && clickY <= mBoxY + 161) {
                    skinToConfirm = null;
                    return;
                }
                return;
            }

            const navY = 560;
            const startX = 20;

            if (clickY >= navY && clickY <= navY + 26) {
                if (clickX >= startX && clickX <= startX + 40 && shopPage > 1) {
                    shopPage--;
                    return;
                }
                if (clickX >= GAME_W - startX - 40 && clickX <= GAME_W - startX && shopPage < 2) {
                    shopPage++;
                    return;
                }
            }

            const pageSkins = skinKeys.filter(k => SKINS[k].page === shopPage);
            const cols = 4;
            const cardW = 78;
            const cardH = 80;
            const gapX = 14;
            const gapY = 12;
            const startY = 275;

            pageSkins.forEach((key, index) => {
                const row = Math.floor(index / cols);
                const col = index % cols;
                const cx = startX + col * (cardW + gapX);
                const cy = startY + row * (cardH + gapY);

                if (clickX >= cx && clickX <= cx + cardW && clickY >= cy && clickY <= cy + cardH) {
                    const isUnlocked = unlockedSkins.includes(key);
                    const skinInfo = SKINS[key];

                    // Кнопка "открыть за рекламу" (только для ещё не открытых скинов)
                    if (!isUnlocked && clickX >= cx + cardW - 24 && clickX <= cx + cardW - 3 && clickY >= cy + 3 && clickY <= cy + 17) {
                        showRewardedAd(() => {
                            if (!unlockedSkins.includes(key)) {
                                unlockedSkins.push(key);
                            }
                            selectedSkin = key;
                            previewSkin = key;
                            localStorage.setItem('burger_unlocked_skins', JSON.stringify(unlockedSkins));
                            localStorage.setItem('burger_skin', selectedSkin);
                            music.playCoinSFX();
                        }, 'skin-unlock');
                        return;
                    }

                    const btnX = cx + 6;
                    const btnY = cy + 56;
                    const btnW = cardW - 12;
                    const btnH = 18;

                    if (clickX >= btnX && clickX <= btnX + btnW && clickY >= btnY && clickY <= btnY + btnH) {
                        if (isUnlocked) {
                            selectedSkin = key;
                            previewSkin = key;
                            localStorage.setItem('burger_skin', key);
                        } else if (money >= skinInfo.price) {
                            skinToConfirm = key;
                        }
                    }
                }
            });
            return;
        }

        if (gameState === STATES.START) {
            const btnW = 230;
            const btnH = 62;
            const btnX = (GAME_W - btnW) / 2;
            const btnY = 385;

            if (clickX >= btnX && clickX <= btnX + btnW && clickY >= btnY && clickY <= btnY + btnH) {
                gameState = STATES.READY;
                resetGame();
            }
            return;
        }

        if (gameState === STATES.GAMEOVER) {
            const boxW = 290;
            const boxH = 400;
            const boxX = (GAME_W - boxW) / 2;
            const boxY = (GAME_H - boxH) / 2;

            // Кнопка "возродиться за рекламу"
            const reviveX = boxX + 35, reviveY = boxY + 250, reviveW = boxW - 70, reviveH = 50;
            if (clickX >= reviveX && clickX <= reviveX + reviveW && clickY >= reviveY && clickY <= reviveY + reviveH) {
                if (revivesUsedThisRun < MAX_REVIVES) {
                    showRewardedAd(() => {
                        reviveAfterAd();
                    }, 'revive');
                }
                return;
            }

            // Кнопка "заново"
            const btnX = boxX + 35, btnY = boxY + 315, btnW = boxW - 70, btnH = 50;
            if (clickX >= btnX && clickX <= btnX + btnW && clickY >= btnY && clickY <= btnY + btnH) {
                if (adRequestInFlight) return;
                tryShowMidgameAd(() => {
                    gameState = STATES.READY;
                    resetGame();
                });
            }
            return;
        }
    }

    if (gameState === STATES.READY) {
        gameState = STATES.PLAYING;
        burger.jump();
    } else if (gameState === STATES.PLAYING) {
        burger.jump();
    }
}

function gameOver() {
    gameState = STATES.GAMEOVER;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('burger_highscore', highScore);
    }
}

function resetGame() {
    score = 0;
    currentBg = { r: 255, g: 245, b: 230 };
    burger.reset();
    obstacles.reset();
    particles = [];
    revivesUsedThisRun = 0; // новый заход - счётчик возрождений за рекламу сбрасывается
}

window.addEventListener('keydown', (e) => {
    if (e.repeat) {
        // Игнорируем авто-повтор зажатой клавиши - иначе бургер улетает вверх слишком быстро
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyP' || e.code === 'Escape') {
            e.preventDefault();
        }
        return;
    }
    if (e.code === 'KeyM') {
        music.toggleMute();
        return;
    }
    if (e.code === 'KeyP' || e.code === 'Escape') {
        if (gameState === STATES.PLAYING) {
            pauseGame();
        } else if (gameState === STATES.PAUSED) {
            resumeGameFromPause();
        }
        e.preventDefault();
        return;
    }
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (gameState !== STATES.START && gameState !== STATES.SHOP && gameState !== STATES.PAUSED && gameState !== STATES.RESUMING) {
            handleInput();
        }
        e.preventDefault();
    }
});

canvas.addEventListener('mousedown', (e) => {
    handleInput(e);
});

canvas.addEventListener('touchstart', (e) => {
    handleInput(e.touches[0]);
    e.preventDefault();
}, { passive: false });

// Наведение мышью (только ПК) - определяем, над кнопкой ли курсор,
// и переключаем CSS-класс для смены картинки курсора
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = GAME_W / rect.width;
    const scaleY = GAME_H / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    hoveredButton = getHoveredButton(mx, my);
    canvas.classList.toggle('btn-hover', !!hoveredButton);
});

canvas.addEventListener('mouseleave', () => {
    hoveredButton = null;
    canvas.classList.remove('btn-hover');
});

burger.reset();

function loop() {
    const nowTs = Date.now();
    const frameDelta = Math.min(nowTs - loopLastTs, 250); // кэп: вкладка в фоне не должна "накручивать" время
    loopLastTs = nowTs;
    // Копим игровое время ТОЛЬКО пока игрок реально играет (прыгает)
    if (gameState === STATES.PLAYING) {
        totalPlayTimeMs += frameDelta;
    }

    if (gameState === STATES.RESUMING && Date.now() - resumeCountdownStart >= RESUME_COUNTDOWN_MS) {
        gameState = STATES.PLAYING;
    }

    ctx.clearRect(0, 0, GAME_W, GAME_H);

    drawBackground();
    obstacles.update();
    obstacles.draw();
    
    updateAndDrawParticles();

    burger.update();
    if (gameState === STATES.PLAYING || gameState === STATES.READY || gameState === STATES.PAUSED || gameState === STATES.RESUMING) {
        burger.draw();
    }
    drawUI();

    requestAnimationFrame(loop);
}

loop();
</script>
