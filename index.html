<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Hop - Diner Breakout</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            background-color: #2b1e17;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        .game-container {
            position: relative;
            /* размер задаётся через JS (см. resizeGame), чтобы игра
               всегда заполняла экран/фрейм Y8, сохраняя пропорции 400:600 */
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 4px solid #5c3c28;
            border-radius: 14px;
            overflow: hidden;
            background: #fff5e6;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Уникальный кастомный курсор в виде бургерной "стрелки" с семечками кунжута,
               10 4 - хотспот (кончик стрелки) */
            cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyOCcgaGVpZ2h0PSczMicgdmlld0JveD0nMCAwIDI4IDMyJz4KPHBhdGggZD0nTTMgMiBMMyAyNCBMOSAxOSBMMTMgMjggTDE4IDI2IEwxNCAxNyBMMjMgMTcgWicgZmlsbD0nI0U4QUI1Ricgc3Ryb2tlPScjNWMzYzI4JyBzdHJva2Utd2lkdGg9JzIuMicgc3Ryb2tlLWxpbmVqb2luPSdyb3VuZCcgc3Ryb2tlLWxpbmVjYXA9J3JvdW5kJy8+CjxjaXJjbGUgY3g9JzgnIGN5PSc4JyByPScxLjQnIGZpbGw9JyNmZmY1ZTYnLz4KPGNpcmNsZSBjeD0nMTIuNScgY3k9JzYnIHI9JzEuMScgZmlsbD0nI2ZmZjVlNicvPgo8L3N2Zz4=') 3 2, auto;
        }
        /* Курсор при наведении на кликабельную кнопку - тот же силуэт, но
           "горячий" оранжево-золотой, с мягким ореолом, чтобы явно читалось
           "тут можно кликнуть" */
        canvas.btn-hover {
            cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczNCcgaGVpZ2h0PSczOCcgdmlld0JveD0nMCAwIDM0IDM4Jz4KPHBhdGggZD0nTTQgMyBMNCAyNSBMMTAgMjAgTDE0IDI5IEwxOSAyNyBMMTUgMTggTDI0IDE4IFonIGZpbGw9JyNGRjlGMUMnIHN0cm9rZT0nIzdhMjIwMCcgc3Ryb2tlLXdpZHRoPScyLjInIHN0cm9rZS1saW5lam9pbj0ncm91bmQnIHN0cm9rZS1saW5lY2FwPSdyb3VuZCcvPgo8Y2lyY2xlIGN4PSc5JyBjeT0nOScgcj0nMS40JyBmaWxsPScjZmZmNWU2Jy8+CjxjaXJjbGUgY3g9JzEzLjUnIGN5PSc3JyByPScxLjEnIGZpbGw9JyNmZmY1ZTYnLz4KPC9zdmc+') 5 3, pointer;
        }

</head>
<body>

<div class="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameContainer = document.querySelector('.game-container');

ctx.imageSmoothingEnabled = false;

// ============================================================================
//  РАЗРЕШЕНИЕ / FULLSCREEN
//  GAME_W/GAME_H - это "логические" координаты, на которых построена вся
//  игра (раньше это было canvas.width/canvas.height напрямую - все такие
//  места в коде заменены на эти константы). Реальный canvas при этом
//  растягивается на весь экран/фрейм Y8 с сохранением пропорций 2:3, а его
//  физическое разрешение (backing store) поднимается под devicePixelRatio,
//  чтобы картинка на больших экранах оставалась чёткой, а не размытой.
// ============================================================================
const GAME_W = 400;
const GAME_H = 600;
const GAME_ASPECT = GAME_W / GAME_H;

function resizeGame() {
    const availW = window.innerWidth;
    const availH = window.innerHeight;
    const availAspect = availW / availH;

    let cssWidth, cssHeight;
    if (availAspect > GAME_ASPECT) {
        // экран шире игры -> ограничиваемся по высоте
        cssHeight = availH;
        cssWidth = cssHeight * GAME_ASPECT;
    } else {
        // экран уже игры -> ограничиваемся по ширине
        cssWidth = availW;
        cssHeight = cssWidth / GAME_ASPECT;
    }

    gameContainer.style.width = cssWidth + 'px';
    gameContainer.style.height = cssHeight + 'px';

    // Поднимаем физическое разрешение канваса (backing store) для чёткости
    // на Retina/HiDPI экранах - это НЕ логические координаты игры.
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);

    // Масштабируем систему координат канваса так, чтобы весь остальной код
    // мог продолжать рисовать в "логических" координатах 0..GAME_W / 0..GAME_H
    const scale = canvas.width / GAME_W;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.imageSmoothingEnabled = false;
}

window.addEventListener('resize', resizeGame);
window.addEventListener('orientationchange', resizeGame);
resizeGame();

const STATES = { START: 0, READY: 1, PLAYING: 2, GAMEOVER: 3, SHOP: 4, PAUSED: 5, RESUMING: 6 };
let gameState = STATES.START;

let score = 0;
let highScore = localStorage.getItem('burger_highscore') || 0;
let money = parseInt(localStorage.getItem('burger_money')) || 0;
let selectedSkin = localStorage.getItem('burger_skin') || 'default';
let previewSkin = selectedSkin; 

// --- РЕКЛАМА / ПАУЗА / ВОЗРОЖДЕНИЯ ---
const MAX_REVIVES = 3;                 // сколько раз можно возродиться за rewarded-рекламу за один заход
let revivesUsedThisRun = 0;            // сколько раз уже возродились в текущем заходе (0/3, 1/3, ...)

// Midgame-реклама (Adsgram interstitial): считаем ТОЛЬКО игровое время, когда
// бургер реально летит (STATES.PLAYING), без сброса между заходами. Когда
// накопилось 2:30 - реклама "созревает", но НЕ прерывает игру: она покажется
// только после смерти и нажатия кнопки TRY AGAIN. Если игрок перевалил порог
// прямо посреди захода - спокойно доигрывает.
let totalPlayTimeMs = 0;               // суммарное игровое время (мс)
let nextMidgameAdAt = 150000;          // порог totalPlayTimeMs, после которого реклама "созрела"
const MIDGAME_AD_INTERVAL = 150000;    // 2 минуты 30 секунд игрового времени
let loopLastTs = Date.now();           // для подсчёта прироста totalPlayTimeMs в главном цикле

let lastCoinAdTime = 0;                // когда последний раз получили +25 монет за рекламу в паузе
const COIN_AD_COOLDOWN = 5 * 60 * 1000; // 5 минут между такими наградами

let prePauseState = STATES.PLAYING;    // в какое состояние возвращаться после паузы
let resumeCountdownStart = 0;          // timestamp начала обратного отсчёта "3..2..1..Jump!"
const RESUME_COUNTDOWN_MS = 3400;      // общая длительность отсчёта

let skinToUnlockWithAd = null;         // какой скин пытаемся открыть через рекламу в магазине

let shopPage = 1;

let skinToConfirm = null; 
let unlockedSkins = JSON.parse(localStorage.getItem('burger_unlocked_skins')) || ['default'];

let menuAnimTime = 0;

// --- SKINS PALETTES & CONFIG ---
const SKINS = {
    // Page 1
    default:     { name: 'DEFAULT', price: 0,  topBun: '#E8AB5F', botBun: '#D99B52', stroke: '#996328', seed: '#FFF5E1', page: 1 },
    red:         { name: 'RED',     price: 10, topBun: '#FF5D5D', botBun: '#E63946', stroke: '#991B1B', seed: '#FFCACA', page: 1 },
    orange:      { name: 'ORANGE',  price: 10, topBun: '#FF9F1C', botBun: '#F77F00', stroke: '#9E4700', seed: '#FFE5B4', page: 1 },
    yellow:      { name: 'YELLOW',  price: 10, topBun: '#FFE66D', botBun: '#FFD166', stroke: '#B78103', seed: '#FFFFE0', page: 1 },
    lime:        { name: 'LIME',    price: 10, topBun: '#A8F53B', botBun: '#8EE000', stroke: '#568A00', seed: '#E9FFC2', page: 1 },
    green:       { name: 'GREEN',   price: 10, topBun: '#2ECC71', botBun: '#27AE60', stroke: '#1E6B3C', seed: '#C8F7DC', page: 1 },
    light_blue:  { name: 'CYAN',    price: 10, topBun: '#4CC9F0', botBun: '#4895EF', stroke: '#1B4998', seed: '#E0F7FC', page: 1 },
    blue:        { name: 'BLUE',    price: 10, topBun: '#3A86FF', botBun: '#2A6FDB', stroke: '#103780', seed: '#D6E4FF', page: 1 },
    brown:       { name: 'BROWN',   price: 10, topBun: '#8D5B4C', botBun: '#6F4336', stroke: '#40241C', seed: '#EAD5CE', page: 1 },
    purple:      { name: 'PURPLE',  price: 10, topBun: '#B5179E', botBun: '#7209B7', stroke: '#3F0469', seed: '#F5C2F0', page: 1 },
    dark_grey:   { name: 'D-GREY',  price: 10, topBun: '#64748B', botBun: '#475569', stroke: '#1E293B', seed: '#E2E8F0', page: 1 },
    white:       { name: 'WHITE',   price: 10, topBun: '#FFFFFF', botBun: '#F1F5F9', stroke: '#94A3B8', seed: '#CBD5E1', page: 1 },
    
    // Page 2
    businessman: { name: 'BIZ-MAN', price: 100, topBun: '#E8AB5F', botBun: '#D99B52', stroke: '#996328', seed: '#FFF5E1', page: 2, hasHat: true, moneyTrail: true, noSeedsEffect: true },
    king:        { name: 'KING',    price: 100, topBun: '#E8AB5F', botBun: '#D99B52', stroke: '#996328', seed: '#FFF5E1', page: 2, hasCrown: true, hasCape: true, gemTrail: true, noSeedsEffect: true },
    chef:        { name: 'CHEF',    price: 100, topBun: '#E8AB5F', botBun: '#D99B52', stroke: '#996328', seed: '#FFF5E1', page: 2, hasChefHat: true, veggieTrail: true, noSeedsEffect: false },
    kindergartner: { name: 'KIDDO', price: 100, topBun: '#E8AB5F', botBun: '#D99B52', stroke: '#996328', seed: '#FFF5E1', page: 2, hasPropellerCap: true, candyTrail: true, noSeedsEffect: false },
    alchemist:   { name: 'ALCHEMY', price: 100, topBun: '#E8AB5F', botBun: '#D99B52', stroke: '#996328', seed: '#FFFFFF', page: 2, rgbEffect: true, magicTrail: true, noSeedsEffect: true },
    cowboy:      { name: 'COWBOY', price: 100, topBun: '#E8AB5F', botBun: '#D99B52', stroke: '#996328', seed: '#FFF5E1', page: 2, hasCowboyHat: true, horseshoeTrail: true, noSeedsEffect: true },
    hawaiian:    { name: 'ALOHA', price: 100, topBun: '#E8AB5F', botBun: '#D99B52', stroke: '#996328', seed: '#FFF5E1', page: 2, hasHawaiian: true, coconutTrail: true, noSeedsEffect: true },
    police:      { name: 'POLICE', price: 100, topBun: '#E8AB5F', botBun: '#D99B52', stroke: '#996328', seed: '#FFF5E1', page: 2, hasPoliceHat: true, hasPoliceUniform: true, sirenTrail: true, noSeedsEffect: true }
};

const skinKeys = Object.keys(SKINS);

// --- PARTICLE SYSTEM ---
let particles = [];

const GEM_TYPES = ['gold', 'emerald', 'ruby', 'diamond', 'lapis'];
const VEGGIE_TYPES = ['tomato', 'broccoli', 'potato'];
const CANDY_TYPES = ['lollipop', 'chocolate'];
const POLICE_TYPES = ['siren', 'donut', 'handcuffs'];

class Particle {
    constructor(x, y, color, type = 'seed') {
        this.x = x + (Math.random() * 10 - 5);
        this.y = y + (Math.random() * 12 - 6);
        this.vx = -Math.random() * 2 - 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        this.size = Math.random() * 2.5 + 2;
        this.rot = Math.random() * Math.PI;
        this.vRot = (Math.random() - 0.5) * 0.1;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
        this.color = color;
        this.type = type; 
        this.gemType = type === 'gem' ? GEM_TYPES[Math.floor(Math.random() * GEM_TYPES.length)] : null;
        this.veggieType = VEGGIE_TYPES.includes(type) ? type : null;
        this.candyType = CANDY_TYPES.includes(type) ? type : null;
        this.sirenColorType = type === 'siren' ? (Math.random() < 0.5 ? 'red' : 'blue') : null;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rot += this.vRot;
        this.life -= this.decay;
    }

    draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.globalAlpha = Math.max(0, this.life);

        if (this.type === 'dollar') {
            drawDollarBill(0, 0, 0.5);
        } else if (this.type === 'gem') {
            drawGemParticle(0, 0, this.gemType);
        } else if (this.veggieType) {
            drawVeggieParticle(0, 0, this.veggieType, this.size);
        } else if (this.candyType) {
            drawCandyParticle(0, 0, this.candyType, this.size);
        } else if (this.type === 'magic') {
            drawMagicSparkle(0, 0, this.color, this.size);
        } else if (this.type === 'horseshoe') {
            drawHorseshoeParticle(0, 0, this.size);
        } else if (this.type === 'coconut') {
            drawCoconutParticle(0, 0, this.size);
        } else if (this.type === 'siren') {
            drawSirenParticle(0, 0, this.size, this.sirenColorType);
        } else if (this.type === 'donut') {
            drawDonutParticle(0, 0, this.size);
        } else if (this.type === 'handcuffs') {
            drawHandcuffsParticle(0, 0, this.size);
        } else {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#5C3C28';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        ctx.restore();
    }
}

function drawHorseshoeParticle(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    const s = size * 1.7;

    // Металлическая подкова (дуга) с пиксельными гвоздями-точками
    ctx.strokeStyle = '#B0B0B0';
    ctx.lineWidth = s * 0.75;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, s * 1.2, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();

    ctx.strokeStyle = '#7A7A7A';
    ctx.lineWidth = s * 0.3;
    ctx.beginPath();
    ctx.arc(0, -s * 0.15, s * 1.2, Math.PI * 0.2, Math.PI * 0.8);
    ctx.stroke();

    // Гвоздики
    ctx.fillStyle = '#4A4A4A';
    for (let i = 0; i < 3; i++) {
        const ang = Math.PI * (0.25 + i * 0.25);
        const nx = Math.cos(ang) * s * 1.2;
        const ny = Math.sin(ang) * s * 1.2;
        ctx.beginPath();
        ctx.arc(nx, ny, s * 0.15, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function drawSirenParticle(x, y, size, colorType) {
    ctx.save();
    ctx.translate(x, y);
    const s = size * 1.6;
    const color = colorType === 'red' ? { r: 255, g: 59, b: 48 } : { r: 58, g: 134, b: 255 };

    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 2.5);
    glow.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0.6)`);
    glow.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, s * 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.25, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawDonutParticle(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    const s = size * 1.5;

    // Тесто-основа (кольцо пончика), нарисованное толстой обводкой окружности
    ctx.strokeStyle = '#D9A066';
    ctx.lineWidth = s * 0.9;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.75, 0, Math.PI * 2);
    ctx.stroke();

    // Розовая глазурь поверх
    ctx.strokeStyle = '#FF8FAB';
    ctx.lineWidth = s * 0.62;
    ctx.beginPath();
    ctx.arc(0, -s * 0.05, s * 0.75, 0, Math.PI * 2);
    ctx.stroke();

    // Блик на глазури
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = s * 0.18;
    ctx.beginPath();
    ctx.arc(0, -s * 0.05, s * 0.75, Math.PI * 1.1, Math.PI * 1.6);
    ctx.stroke();

    // Разноцветная посыпка
    const sprinkleColors = ['#4CC9F0', '#FFD166', '#06D6A0', '#EF476F', '#FFFFFF'];
    for (let i = 0; i < 5; i++) {
        const ang = (Math.PI * 2 / 5) * i + 0.3;
        const r = s * 0.75;
        const sx = Math.cos(ang) * r * 0.9;
        const sy = -s * 0.05 + Math.sin(ang) * r * 0.55;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(ang);
        ctx.fillStyle = sprinkleColors[i % sprinkleColors.length];
        ctx.fillRect(-s * 0.14, -s * 0.04, s * 0.28, s * 0.08);
        ctx.restore();
    }

    ctx.restore();
}

function drawHandcuffsParticle(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    const s = size * 1.3;
    const metal = '#C4CCD6';
    const metalDark = '#7C8793';

    // Тёмная подложка колец (пиксельная обводка)
    ctx.strokeStyle = metalDark;
    ctx.lineWidth = s * 0.55;
    ctx.beginPath(); ctx.arc(-s * 0.85, 0, s * 0.6, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * 0.85, 0, s * 0.6, 0, Math.PI * 2); ctx.stroke();

    // Светлые кольца наручников
    ctx.strokeStyle = metal;
    ctx.lineWidth = s * 0.32;
    ctx.beginPath(); ctx.arc(-s * 0.85, 0, s * 0.6, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * 0.85, 0, s * 0.6, 0, Math.PI * 2); ctx.stroke();

    // Соединительная перемычка
    ctx.strokeStyle = metalDark;
    ctx.lineWidth = s * 0.26;
    ctx.beginPath();
    ctx.moveTo(-s * 0.3, 0); ctx.lineTo(s * 0.3, 0);
    ctx.stroke();
    ctx.strokeStyle = metal;
    ctx.lineWidth = s * 0.14;
    ctx.beginPath();
    ctx.moveTo(-s * 0.3, 0); ctx.lineTo(s * 0.3, 0);
    ctx.stroke();

    ctx.restore();
}

function drawBadgeStar(cx, cy, r, colorMain, colorDark) {
    ctx.fillStyle = colorDark;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        const ang = (Math.PI / 5) * i - Math.PI / 2;
        const rad = i % 2 === 0 ? r : r * 0.45;
        const sx = cx + Math.cos(ang) * rad;
        const sy = cy + Math.sin(ang) * rad;
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = colorMain;
    const r2 = r - 0.8, r2in = r * 0.45 - 0.4;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        const ang = (Math.PI / 5) * i - Math.PI / 2;
        const rad = i % 2 === 0 ? r2 : r2in;
        const sx = cx + Math.cos(ang) * rad;
        const sy = cy + Math.sin(ang) * rad;
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fill();
}

function drawPoliceHat(x, y) {
    ctx.save();
    ctx.translate(x, y);

    const navy = '#1B2A4A';
    const navyDark = '#111C36';
    const black = '#161616';
    const silver = '#B8C2CE';
    const gold = '#FFC93C';
    const goldDark = '#C9960B';

    // Базовая линия: низ козырька фуражки лежит точно на макушке булки (y = -17),
    // как и у остальных головных уборов, чтобы фуражка не "парила" над бургером.
    const brimY = -17;
    const bandBottom = brimY - 4;   // -21
    const bandTop = bandBottom - 8; // -29
    const domeRx = 17;
    const domeRy = 10;

    // --- Чёрный лакированный козырёк (плоский овал, выглядывает из-под околыша) ---
    ctx.fillStyle = black;
    ctx.strokeStyle = navyDark;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(0, brimY, 21, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Блик на козырьке
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(0, brimY - 0.5, 15, 2, 0, 0.15, Math.PI - 0.15);
    ctx.stroke();

    // --- Купол (тулья): невысокий скруглённый пиксельный купол, без "домика" ---
    ctx.fillStyle = navy;
    ctx.strokeStyle = navyDark;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-domeRx, bandTop + 2);
    ctx.ellipse(0, bandTop + 2, domeRx, domeRy, 0, Math.PI, 0);
    ctx.lineTo(domeRx, bandTop + 6);
    ctx.lineTo(-domeRx, bandTop + 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Пиксельные грани купола для объёма (как у остальных шляп в игре)
    ctx.strokeStyle = navyDark;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, bandTop + 2 - domeRy); ctx.lineTo(-5, bandTop + 5); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, bandTop + 2 - domeRy); ctx.lineTo(5, bandTop + 5); ctx.stroke();

    // Мягкий блик на куполе слева
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath();
    ctx.ellipse(-8, bandTop - 2, 5, 8, 0.3, 0, Math.PI * 2);
    ctx.fill();

    // --- Серебристый кант над околышем ---
    ctx.fillStyle = silver;
    ctx.fillRect(-19, bandTop + 6, 38, 2);

    // --- Чёрный околыш ---
    ctx.fillStyle = black;
    ctx.beginPath();
    ctx.roundRect(-19, bandTop + 8, 38, bandBottom - (bandTop + 8), 1.5);
    ctx.fill();

    // Золотые пуговицы-кокарды по бокам околыша
    ctx.fillStyle = gold;
    ctx.strokeStyle = goldDark;
    ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.arc(-15, bandBottom - 2.5, 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(15, bandBottom - 2.5, 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // Кокарда-звезда по центру околыша
    drawBadgeStar(0, bandBottom - 2.5, 4.4, gold, goldDark);

    ctx.restore();
}

function drawBusinessSuit(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Пиджак, воротник рубашки и галстук с диагональной полосой (по референсу)
    const suitColor = '#20232B';
    const suitDark = '#101216';
    const shirtColor = '#FFFFFF';
    const tieColor = '#E63946';
    const tieDark = '#9C1C2A';
    const stripeColor = '#FFC93C';

    // Лацканы пиджака
    ctx.fillStyle = suitColor;

    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.moveTo(-21, 6);
    ctx.lineTo(-5, 6);
    ctx.lineTo(-9, 18);
    ctx.lineTo(-21, 15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(21, 6);
    ctx.lineTo(5, 6);
    ctx.lineTo(9, 18);
    ctx.lineTo(21, 15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Заливка торса пиджака между лацканами (чтобы под галстуком/воротником
    // не просвечивала булочка) - рисуется до воротника и галстука, поэтому
    // они лягут поверх неё
    ctx.fillStyle = suitColor;
    ctx.strokeStyle = suitDark;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-9, 18);
    ctx.lineTo(-5, 6);
    ctx.lineTo(5, 6);
    ctx.lineTo(9, 18);
    ctx.lineTo(9, 21);
    ctx.lineTo(-9, 21);
    ctx.closePath();
    ctx.fill();

    // Воротник рубашки (белый, за галстуком)
    ctx.fillStyle = shirtColor;
    ctx.beginPath();
    ctx.moveTo(-5, 6);
    ctx.lineTo(0, 10);
    ctx.lineTo(-3, 15);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(5, 6);
    ctx.lineTo(0, 10);
    ctx.lineTo(3, 15);
    ctx.closePath();
    ctx.fill();

    // Узел галстука
    ctx.fillStyle = tieColor;
    ctx.strokeStyle = tieDark;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-2.5, 7);
    ctx.lineTo(2.5, 7);
    ctx.lineTo(2, 11);
    ctx.lineTo(-2, 11);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Тело галстука, сужающееся к острию
    const tiePath = () => {
        ctx.beginPath();
        ctx.moveTo(-2, 11);
        ctx.lineTo(2, 11);
        ctx.lineTo(1.5, 17);
        ctx.lineTo(0, 19.5);
        ctx.lineTo(-1.5, 17);
        ctx.closePath();
    };
    tiePath();
    ctx.fill();
    ctx.stroke();

    // Диагональная золотая полоса на галстуке, как на референсе
    ctx.save();
    tiePath();
    ctx.clip();
    ctx.fillStyle = stripeColor;
    ctx.translate(0, 13.5);
    ctx.rotate(-0.55);
    ctx.fillRect(-7, -1.1, 14, 2.2);
    ctx.fillRect(-7, 3.9, 14, 2.2);
    ctx.restore();

    ctx.restore();
}

function drawCowboyHat(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Пиксель-арт ковбойская шляпа (аналог референса): тан-оранжевая, с чёрным контуром,
    // широкими загнутыми полями и тёмной лентой на тулье
    const p = 1.15; // размер "пикселя" (уменьшено, чтобы шляпа была компактнее и не давила на глаза)
    const tan = '#E39B4E';
    const tanDark = '#C97F35';
    const band = '#5C3320';
    const outline = '#1A1A1A';

    const px = (col, row, w, h, color) => {
        ctx.fillStyle = color;
        ctx.fillRect(col * p, row * p, w * p, h * p);
    };

    // Смещение так, чтобы шляпа центровалась над бургером и лишь слегка
    // перекрывала верх булочки, не опускаясь на глаза (нижний край полей
    // фиксируется на y = -17, как у цилиндра бизнесмена)
    ctx.translate(-13 * p, -17 - 23 * p);

    // --- Контур (чёрная подложка чуть больше основной формы) ---
    ctx.fillStyle = outline;
    // поля (широкая нижняя часть)
    ctx.fillRect(-1 * p, 15 * p, 28 * p, 6 * p);
    ctx.fillRect(1 * p, 21 * p, 24 * p, 2 * p);
    // загнутые края полей вверх по бокам
    ctx.fillRect(-1 * p, 11 * p, 5 * p, 5 * p);
    ctx.fillRect(22 * p, 11 * p, 5 * p, 5 * p);
    // тулья (купол)
    ctx.fillRect(6 * p, 2 * p, 14 * p, 14 * p);
    ctx.fillRect(9 * p, -1 * p, 8 * p, 4 * p);

    // --- Основной тан-цвет поверх контура (с отступом 1px для чёрной обводки) ---
    // поля
    px(0, 16, 26, 4, tan);
    px(2, 20, 22, 1, tanDark);
    // загнутые концы полей
    px(0, 12, 3, 3, tanDark);
    px(23, 12, 3, 3, tanDark);
    // тулья (купол) - основной объём
    px(7, 3, 12, 11, tan);
    px(10, 0, 6, 3, tan);

    // мягкая вмятина/блик по центру тульи (характерная для ковбойской шляпы)
    ctx.fillStyle = tanDark;
    ctx.beginPath();
    ctx.moveTo(9 * p, 3 * p);
    ctx.quadraticCurveTo(13 * p, 6 * p, 9 * p, 13 * p);
    ctx.lineTo(9 * p, 13.6 * p);
    ctx.quadraticCurveTo(13.5 * p, 6 * p, 9.6 * p, 2.6 * p);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(19 * p, 3 * p);
    ctx.quadraticCurveTo(15 * p, 6 * p, 19 * p, 13 * p);
    ctx.lineTo(19 * p, 13.6 * p);
    ctx.quadraticCurveTo(14.5 * p, 6 * p, 19.6 * p, 2.6 * p);
    ctx.closePath();
    ctx.fill();

    // лента на тулье
    px(7, 12, 12, 2, band);

    // --- Звезда-шериф по центру ленты ---
    ctx.fillStyle = outline;
    const starCx = 13 * p, starCy = 13 * p, starR = 2.6 * p, starIn = 1.1 * p;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        const ang = (Math.PI / 5) * i - Math.PI / 2;
        const r = i % 2 === 0 ? starR : starIn;
        const sx = starCx + Math.cos(ang) * r;
        const sy = starCy + Math.sin(ang) * r;
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#FFD93D';
    const starR2 = starR - p * 0.4, starIn2 = starIn - p * 0.2;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        const ang = (Math.PI / 5) * i - Math.PI / 2;
        const r = i % 2 === 0 ? starR2 : starIn2;
        const sx = starCx + Math.cos(ang) * r;
        const sy = starCy + Math.sin(ang) * r;
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawCoconutParticle(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    const s = size * 1.6;

    // Волосатая скорлупа кокоса
    ctx.fillStyle = '#5C3C28';
    ctx.beginPath();
    ctx.arc(0, 0, s, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#442B1C';
    ctx.beginPath();
    ctx.arc(-s * 0.3, -s * 0.3, s * 0.4, 0, Math.PI * 2);
    ctx.fill();

    // Отколотый кусочек с белой мякотью
    ctx.fillStyle = '#F5EEDD';
    ctx.beginPath();
    ctx.arc(s * 0.35, s * 0.15, s * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#5C3C28';
    ctx.lineWidth = 0.6;
    ctx.stroke();

    // Три характерных "глазка" кокоса
    ctx.fillStyle = '#2A1A10';
    ctx.beginPath(); ctx.arc(-s * 0.15, s * 0.4, s * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-s * 0.5, s * 0.05, s * 0.14, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
}

function drawHibiscusFlower(x, y, size, petalColor, centerColor) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = petalColor;
    const petals = 5;
    for (let i = 0; i < petals; i++) {
        ctx.save();
        ctx.rotate((Math.PI * 2 / petals) * i);
        ctx.beginPath();
        ctx.ellipse(0, -size, size * 0.55, size * 0.95, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    ctx.fillStyle = centerColor;
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawHawaiianShirt(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Гавайская рубашка повторяет округлый контур нижней булочки (как roundRect
    // самой булочки), поверх неё — лацканы, всё вместе выглядит как застёгнутая
    // рубашка без просветов булочки посередине
    const shirtRed = '#E63946';
    const shirtDark = '#C5303D';
    const outline = '#7A1420';

    // Базовая панель точно по форме нижней булочки — закрывает весь просвет
    ctx.fillStyle = shirtRed;
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-20, 4, 40, 14, [4, 4, 8, 8]);
    ctx.fill();
    ctx.stroke();

    // Лацканы поверх базовой панели для объёма
    ctx.fillStyle = shirtDark;
    ctx.beginPath();
    ctx.moveTo(-20, 6);
    ctx.lineTo(-4, 6);
    ctx.lineTo(-8, 18);
    ctx.lineTo(-20, 16);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(20, 6);
    ctx.lineTo(4, 6);
    ctx.lineTo(8, 18);
    ctx.lineTo(20, 16);
    ctx.closePath();
    ctx.fill();

    // Маленький воротник-стойка по центру сверху
    ctx.fillStyle = shirtRed;
    ctx.strokeStyle = outline;
    ctx.beginPath();
    ctx.moveTo(-7, 5);
    ctx.lineTo(-3, 1);
    ctx.lineTo(3, 1);
    ctx.lineTo(7, 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = shirtDark;
    ctx.beginPath();
    ctx.moveTo(-3, 2);
    ctx.lineTo(0, 5);
    ctx.lineTo(3, 2);
    ctx.closePath();
    ctx.fill();

    // Ряд пуговиц по центру застёгнутой рубашки
    ctx.fillStyle = '#3A2010';
    ctx.beginPath(); ctx.arc(0, 8, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 12, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 16, 1.2, 0, Math.PI * 2); ctx.fill();

    // Цветочный принт гибискуса
    drawHibiscusFlower(-13, 9, 2.4, '#FFD166', '#F2CB05');
    drawHibiscusFlower(-14, 15.5, 2, '#FFFFFF', '#F2CB05');
    drawHibiscusFlower(13, 9, 2.4, '#FFD166', '#F2CB05');
    drawHibiscusFlower(14, 15.5, 2, '#FFFFFF', '#F2CB05');

    ctx.restore();
}

function drawGemParticle(x, y, gemType) {
    ctx.save();
    ctx.translate(x, y);

    let mainColor = '#FFD700';
    let lightColor = '#FFF59D';

    if (gemType === 'emerald') { mainColor = '#2ECC71'; lightColor = '#A8F53B'; }
    else if (gemType === 'ruby') { mainColor = '#E74C3C'; lightColor = '#FF8A80'; }
    else if (gemType === 'diamond') { mainColor = '#00FFFF'; lightColor = '#E0FFFF'; }
    else if (gemType === 'lapis') { mainColor = '#2980B9'; lightColor = '#85C1E9'; }

    ctx.fillStyle = mainColor;
    ctx.beginPath();
    ctx.moveTo(0, -5);
    ctx.lineTo(4, -2);
    ctx.lineTo(3, 5);
    ctx.lineTo(-3, 5);
    ctx.lineTo(-4, -2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = lightColor;
    ctx.beginPath();
    ctx.moveTo(0, -5);
    ctx.lineTo(2, -2);
    ctx.lineTo(0, 2);
    ctx.lineTo(-2, -2);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawVeggieParticle(x, y, type, size) {
    ctx.save();
    ctx.translate(x, y);
    if (type === 'tomato') {
        ctx.fillStyle = '#FF6347';
        ctx.beginPath();
        ctx.arc(0, 0, size * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#32CD32';
        ctx.fillRect(-size/2, -size*1.8, size, size);

        ctx.fillStyle = '#228B22';
        ctx.beginPath();
        ctx.arc(0, -size, size, 0, Math.PI * 2);
        ctx.arc(-size, size, size*0.8, 0, Math.PI * 2);
        ctx.arc(size, size, size*0.8, 0, Math.PI * 2);
        ctx.fill();
    } else if (type === 'potato') {
        ctx.fillStyle = '#CD853F';
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 1.8, size * 1.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(size/2, size/2, 1, 1);
        ctx.fillRect(-size/2, -size/2, 1, 1);
    }
    ctx.restore();

function drawCandyParticle(x, y, type, size) {
    ctx.save();
    ctx.translate(x, y);

    if (type === 'lollipop') {
        // Палочка
        ctx.strokeStyle = '#E8C39E';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(0, size * 1.3);
        ctx.lineTo(0, size * 2.8);
        ctx.stroke();

        // Радужная карамель-водоворот
        const swirlColors = ['#FF5D5D', '#FFD166', '#4CC9F0', '#2ECC71', '#B5179E', '#FF9F1C'];
        for (let i = 0; i < swirlColors.length; i++) {
            ctx.fillStyle = swirlColors[i];
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, size * 1.7, (i / swirlColors.length) * Math.PI * 2, ((i + 1) / swirlColors.length) * Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.arc(0, 0, size * 1.7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = '#5C3C28';
        ctx.lineWidth = 0.6;
        ctx.stroke();
    } else if (type === 'chocolate') {
        // Плитка шоколада
        ctx.fillStyle = '#6F4336';
        ctx.beginPath();
        ctx.roundRect(-size * 1.8, -size * 1.2, size * 3.6, size * 2.4, 2);
        ctx.fill();
        ctx.strokeStyle = '#3D2418';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Дольки
        ctx.strokeStyle = '#3D2418';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(0, -size * 1.2);
        ctx.lineTo(0, size * 1.2);
        ctx.moveTo(-size * 1.8, 0);
        ctx.lineTo(size * 1.8, 0);
        ctx.stroke();

        ctx.fillStyle = '#8D5B4C';
        ctx.fillRect(-size * 1.6, -size, size * 1.15, size * 0.75);
        ctx.fillRect(size * 0.45, size * 0.25, size * 1.15, size * 0.75);
    }

    ctx.restore();
}

function updateAndDrawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.update();
        p.draw();
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

// --- AUDIO SYSTEM ---
class MusicSystem {
    constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.isMuted = false;
        this.noteIndex = 0;
        this.timer = null;

        this.melody = [
            261.63, 329.63, 392.00, 523.25, 392.00, 329.63,
            293.66, 349.23, 440.00, 587.33, 440.00, 349.23,
            329.63, 392.00, 493.88, 659.25, 493.88, 392.00,
            392.00, 440.00, 493.88, 523.25, 587.33, 659.25
        ];
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, duration) {
        if (!this.ctx || this.isMuted) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }

    playJumpSFX() {
        if (!this.ctx || this.isMuted) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.12);
    }

    playCoinSFX() {
        if (!this.ctx || this.isMuted) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.08);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.25);
    }

    playClickSFX() {
        if (!this.ctx || this.isMuted) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(720, now);
        osc.frequency.exponentialRampToValueAtTime(380, now + 0.05);

        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.07);
    }

    start() {
        this.init();
        if (this.isPlaying) return;
        this.isPlaying = true;
        this.noteIndex = 0;

        this.timer = setInterval(() => {
            if (!this.isMuted && this.isPlaying) {
                const note = this.melody[this.noteIndex];
                this.playTone(note, 0.22);
                this.noteIndex = (this.noteIndex + 1) % this.melody.length;
            }
        }, 180);
    }

    toggleMute() {
        this.isMuted = !this.isMuted;
    }
}

// ============================================================================
//  РЕКЛАМА (Adsgram SDK) - только Rewarded
//  Единственное место в коде, которое общается с Adsgram. Остальная игра
//  просто вызывает showRewardedAd(onSuccess, имя).
//  onSuccess вызывается ТОЛЬКО если ролик досмотрен до конца (result.done).
//  Если игрок пропустил рекламу, случилась ошибка или нет заполнения -
//  награда не выдаётся.
// ============================================================================
const ADSGRAM_REWARD_BLOCK_ID = '49074';   // Rewarded
const ADSGRAM_MIDGAME_BLOCK_ID = 'int-49076'; // Interstitial (midgame)
let adsgramRewardController = null;
let adsgramMidgameController = null;
let adRequestInFlight = false; // защита от повторных кликов, пока реклама грузится/играет

function initAdController(blockId) {
    try {
        if (window.Adsgram) {
            return window.Adsgram.init({ blockId: blockId });
        }
    } catch (error) {
        console.error('[Adsgram] init error (' + blockId + '):', error);
    }
    return null;
}

function getAdController() {
    if (!adsgramRewardController) adsgramRewardController = initAdController(ADSGRAM_REWARD_BLOCK_ID);
    return adsgramRewardController;
}

function getMidgameController() {
    if (!adsgramMidgameController) adsgramMidgameController = initAdController(ADSGRAM_MIDGAME_BLOCK_ID);
    return adsgramMidgameController;
}

function showRewardedAd(onSuccess, adName = 'reward') {
    if (adRequestInFlight) return;
    const controller = getAdController();
    if (!controller) {
        console.warn('[Adsgram] SDK не загружен (игра открыта не в Telegram или скрипт заблокирован)');
        return;
    }
    adRequestInFlight = true;

    // глушим музыку на время рекламы, а потом возвращаем, только если она играла
    const musicWasRunning = !!(music.ctx && music.ctx.state === 'running');
    if (musicWasRunning) music.ctx.suspend();

    controller.show()
        .then((result) => {
            if (result && result.done) onSuccess();
        })
        .catch((result) => {
            console.warn('[Adsgram] ' + adName + ':', result && (result.description || result));
        })
        .finally(() => {
            adRequestInFlight = false;
            if (musicWasRunning && music.ctx && music.ctx.state === 'suspended' && !music.isMuted) {
                music.ctx.resume();
            }
        });
}

// Midgame (interstitial). Вызывается ТОЛЬКО при нажатии TRY AGAIN на экране
// Game Over. Если игровое время ещё не набрало порог или рекламы нет / SDK не
// загружен / случилась ошибка - onDone вызывается сразу, и игра просто
// перезапускается. Если реклама показана - onDone вызывается после её
// закрытия (игрок закрыл ролик, досмотрел его или произошла ошибка).
function tryShowMidgameAd(onDone) {
    if (totalPlayTimeMs < nextMidgameAdAt || adRequestInFlight) {
        onDone();
        return;
    }
    const controller = getMidgameController();
    if (!controller) {
        onDone();
        return;
    }
    adRequestInFlight = true;
    // следующая реклама - через 2:30 игрового времени от этого момента
    nextMidgameAdAt = totalPlayTimeMs + MIDGAME_AD_INTERVAL;

    const musicWasRunning = !!(music.ctx && music.ctx.state === 'running');
    if (musicWasRunning) music.ctx.suspend();

    controller.show()
        .catch((result) => {
            console.warn('[Adsgram] midgame:', result && (result.description || result));
        })
        .finally(() => {
            adRequestInFlight = false;
            if (musicWasRunning && music.ctx && music.ctx.state === 'suspended' && !music.isMuted) {
                music.ctx.resume();
            }
            onDone();
        });
}

// Запускает обратный отсчёт "3..2..1..Jump!" перед тем как реально возобновить игру
function startResumeCountdown() {
    resumeCountdownStart = Date.now();
    gameState = STATES.RESUMING;
}

// Ставит игру на паузу (нажатие кнопки паузы пользователем)
function pauseGame() {
    if (gameState !== STATES.PLAYING) return;
    prePauseState = STATES.PLAYING;
    gameState = STATES.PAUSED;
    if (music.ctx && music.ctx.state === 'running') music.ctx.suspend();
}

// Возобновление после ручной паузы - с отсчётом
function resumeGameFromPause() {
    if (music.ctx && music.ctx.state === 'suspended' && !music.isMuted) music.ctx.resume();
    startResumeCountdown();
}

// Возрождение после rewarded-рекламы на экране Game Over
function reviveAfterAd() {
    revivesUsedThisRun++;
    burger.y = GAME_H / 2;
    burger.vy = 0;
    burger.rotation = 0;

    // расчищаем трубы рядом с бургером, чтобы не умереть сразу же снова
    const safeZone = 160;
    obstacles.list = obstacles.list.filter(o => !(o.x < burger.x + safeZone && o.x + obstacles.width > burger.x - 80));
    obstacles.list.forEach(o => { if (o.x < burger.x + safeZone + 40) o.x += safeZone + 40; });
    obstacles.dollars = obstacles.dollars.filter(d => d.x > burger.x + safeZone);

    startResumeCountdown();
}

// ============================================================================
//  МИНИМАЛИСТИЧНЫЕ ГОРЫ НА ФОНЕ (референс: слоистые силуэты гор)
//  Три слоя силуэтов гор, "подножие" упирается в самый низ канваса.
//  Цвет каждого слоя берётся от currentBg (текущего игрового фона) и
//  затемняется на свою величину - поэтому когда фон меняет гамму каждые
//  5 очков, горы автоматически перекрашиваются в тон новой гаммы.
//  Высота самого высокого (заднего) слоя специально держится заметно
//  меньше половины экрана, чтобы горы не занимали пол экрана.
// ============================================================================
const MOUNTAIN_LAYER_BACK = [
    { x: 0.00, h: 0.10 }, { x: 0.10, h: 0.55 }, { x: 0.20, h: 0.28 },
    { x: 0.33, h: 0.95 }, { x: 0.45, h: 0.40 }, { x: 0.58, h: 0.70 },
    { x: 0.68, h: 0.25 }, { x: 0.80, h: 0.60 }, { x: 0.90, h: 0.15 },
    { x: 1.00, h: 0.35 }
];
const MOUNTAIN_LAYER_MID = [
    { x: 0.00, h: 0.35 }, { x: 0.14, h: 0.70 }, { x: 0.28, h: 0.40 },
    { x: 0.42, h: 0.85 }, { x: 0.55, h: 0.45 }, { x: 0.68, h: 0.95 },
    { x: 0.80, h: 0.55 }, { x: 0.92, h: 0.75 }, { x: 1.00, h: 0.50 }
];
const MOUNTAIN_LAYER_FRONT = [
    { x: 0.00, h: 0.60 }, { x: 0.18, h: 0.95 }, { x: 0.35, h: 0.55 },
    { x: 0.52, h: 1.00 }, { x: 0.68, h: 0.60 }, { x: 0.85, h: 0.90 },
    { x: 1.00, h: 0.65 }
];

// amplitude - максимальная высота пика слоя в пикселях, shade - насколько
// затемнить currentBg для этого слоя (дальние горы светлее, ближние темнее).
const MOUNTAIN_LAYERS = [
    { points: MOUNTAIN_LAYER_BACK,  amplitude: 190, shade: -18 },
    { points: MOUNTAIN_LAYER_MID,   amplitude: 145, shade: -55 },
    { points: MOUNTAIN_LAYER_FRONT, amplitude: 95,  shade: -95 }
];

function drawMountainLayer(points, amplitude, baseY, colorRgb) {
    const pts = points.map(p => ({
        x: p.x * GAME_W,
        y: baseY - p.h * amplitude
    }));

    ctx.beginPath();
    ctx.moveTo(0, baseY + 2);
    ctx.lineTo(pts[0].x, pts[0].y);
    for (let i = 0; i < pts.length - 1; i++) {
        const midX = (pts[i].x + pts[i + 1].x) / 2;
        const midY = (pts[i].y + pts[i + 1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
    }
    ctx.quadraticCurveTo(pts[pts.length - 1].x, pts[pts.length - 1].y, GAME_W, baseY + 2);
    ctx.lineTo(GAME_W, baseY + 2);
    ctx.closePath();
    ctx.fillStyle = `rgb(${Math.round(colorRgb.r)}, ${Math.round(colorRgb.g)}, ${Math.round(colorRgb.b)})`;
    ctx.fill();
}

function drawMountains(baseColor) {
    const baseY = GAME_H; // подножие гор упирается в самый низ канваса
    MOUNTAIN_LAYERS.forEach(layer => {
        const layerColor = shadeColor(baseColor, layer.shade);
        drawMountainLayer(layer.points, layer.amplitude, baseY, layerColor);
    });
}

function shadeColor(c, amt) {
    return {
        r: Math.min(255, Math.max(0, c.r + amt)),
        g: Math.min(255, Math.max(0, c.g + amt)),
        b: Math.min(255, Math.max(0, c.b + amt))
    };
}

function lerp(start, end, amt) {
    return start + (end - start) * amt;
}

function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}

// --- Палитра скина "Алхимик" - переливается: голубой -> красный -> фиолетовый -> синий -> зелёный (оригинал) ---
const ALCHEMY_PALETTE = ['#4CC9F0', '#E63946', '#7209B7', '#3A86FF', '#2ECC71'];

function getAlchemyColor(timeOverride) {
    const time = timeOverride !== undefined ? timeOverride : menuAnimTime;
    const period = 6; // сколько "времени" держится каждый цвет перед переходом
    const total = ALCHEMY_PALETTE.length * period;
    const t = ((time % total) + total) % total;
    const idx = Math.floor(t / period);
    const nextIdx = (idx + 1) % ALCHEMY_PALETTE.length;
    const localT = (t % period) / period;
    const c1 = hexToRgb(ALCHEMY_PALETTE[idx]);
    const c2 = hexToRgb(ALCHEMY_PALETTE[nextIdx]);
    const r = Math.round(lerp(c1.r, c2.r, localT));
    const g = Math.round(lerp(c1.g, c2.g, localT));
    const b = Math.round(lerp(c1.b, c2.b, localT));
    return { r, g, b, hex: `rgb(${r}, ${g}, ${b})` };
}

function drawMagicSparkle(x, y, color, size) {
    ctx.save();
    ctx.translate(x, y);

    const s = size * 1.8;

    // мягкое свечение вокруг искры
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 2.2);
    glow.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0.55)`);
    glow.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, s * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // четырёхлучевая искра
    ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.quadraticCurveTo(s * 0.25, -s * 0.25, s, 0);
    ctx.quadraticCurveTo(s * 0.25, s * 0.25, 0, s);
    ctx.quadraticCurveTo(-s * 0.25, s * 0.25, -s, 0);
    ctx.quadraticCurveTo(-s * 0.25, -s * 0.25, 0, -s);
    ctx.closePath();
    ctx.fill();

    // яркий белый центр
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.28, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

            const candy = CANDY_TYPES[Math.floor(Math.random() * CANDY_TYPES.length)];
            particles.push(new Particle(this.x - 12, this.y, null, candy));
        }
        if (skin.magicTrail && Math.random() < 0.6) {
            particles.push(new Particle(this.x - 12, this.y, getAlchemyColor(), 'magic'));
        }
        if (skin.horseshoeTrail && Math.random() < 0.5) {
            particles.push(new Particle(this.x - 12, this.y, null, 'horseshoe'));
        }
        if (skin.coconutTrail && Math.random() < 0.5) {
            particles.push(new Particle(this.x - 12, this.y, null, 'coconut'));
        }
        if (skin.sirenTrail && Math.random() < 0.35) {
            const pType = POLICE_TYPES[Math.floor(Math.random() * POLICE_TYPES.length)];
            particles.push(new Particle(this.x - 12, this.y, null, pType));
        }

        if (this.y >= GAME_H - this.radius || this.y <= this.radius) {
            gameOver();
        }

        this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 5, this.vy * 0.07));
    },

    drawChefHat(x, y) {
        ctx.save();
        ctx.translate(x, y);

        const outline = '#3A2010';
        const white = '#FFFFFF';
        const shadow = '#E0E0E0';
        const p = 1.3; // Чуть уменьшили масштаб пикселей, чтобы шляпа идеально сидела

        // Смещение вниз: Y опущен так, что ободок плотно ложится на булочку
        const topY = -16; 

        // 1. Ободок (сидит прямо на верхушке булочки)
        ctx.fillStyle = shadow;
        ctx.fillRect(-7*p, topY - 4*p, 14*p, 4*p);
        ctx.fillStyle = white;
        ctx.fillRect(-6*p, topY - 4*p, 12*p, 3*p);

        // 2. Пышная верхушка
        ctx.fillStyle = shadow;
        ctx.fillRect(-11*p, topY - 14*p, 22*p, 10*p);
        ctx.fillRect(-9*p, topY - 17*p, 18*p, 3*p);

        ctx.fillStyle = white;
        ctx.fillRect(-10*p, topY - 15*p, 20*p, 10*p);
        ctx.fillRect(-8*p, topY - 17*p, 16*p, 2*p);

        // Складки
        ctx.fillStyle = shadow;
        ctx.fillRect(-4*p, topY - 15*p, 2*p, 8*p);
        ctx.fillRect(2*p, topY - 15*p, 2*p, 8*p);

        // 3. Контур
        ctx.fillStyle = outline;
        ctx.fillRect(-8*p, topY - 18*p, 16*p, 1*p);
        ctx.fillRect(-10*p, topY - 17*p, 2*p, 1*p);
        ctx.fillRect(8*p, topY - 17*p, 2*p, 1*p);
        ctx.fillRect(-12*p, topY - 15*p, 1*p, 10*p);
        ctx.fillRect(11*p, topY - 15*p, 1*p, 10*p);
        ctx.fillRect(-11*p, topY - 5*p, 4*p, 1*p);
        ctx.fillRect(7*p, topY - 5*p, 4*p, 1*p);
        ctx.fillRect(-8*p, topY - 4*p, 1*p, 4*p);
        ctx.fillRect(7*p, topY - 4*p, 1*p, 4*p);
        ctx.fillRect(-7*p, topY, 14*p, 1*p);

        ctx.restore();
    },

    drawPropellerCap(x, y) {
        ctx.save();
        ctx.translate(x, y);

        // Равномерно уменьшаем всю кепку (без перекоса пропорций),
        // точка опоры — нижний край козырька, чтобы шляпа не съезжала с бургера
        const scaleFactor = 1.05;
        const pivotY = -8;
        ctx.translate(0, pivotY);
        ctx.scale(scaleFactor, scaleFactor);
        ctx.translate(0, -pivotY);

        // Козырёк смотрит прямо на нас — рисуем его ровной дугой по центру
        ctx.fillStyle = '#1B5E3A';
        ctx.beginPath();
        ctx.ellipse(0, -14, 15, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#0F3D26';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#164E33';
        ctx.beginPath();
        ctx.ellipse(0, -13, 12, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Купол кепки, разбитый на 3 цветных сегмента (клип по форме купола)
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, -18, 16, Math.PI, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        ctx.fillStyle = '#E53E3E';
        ctx.fillRect(-16, -34, 11, 17);
        ctx.fillStyle = '#3A86FF';
        ctx.fillRect(-5.5, -34, 11, 17);
        ctx.fillStyle = '#FFC93C';
        ctx.fillRect(5.5, -34, 11, 17);
        ctx.restore();

        ctx.strokeStyle = '#1A1A1A';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, -18, 16, Math.PI, Math.PI * 2);
        ctx.stroke();

        // Кнопка на макушке
        ctx.fillStyle = '#94A3B8';
        ctx.beginPath();
        ctx.arc(0, -34, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Стержень пропеллера
        ctx.fillStyle = '#94A3B8';
        ctx.fillRect(-1.5, -42, 3, 8);

        // Лопасти пропеллера (вид сверху-спереди)
        ctx.save();
        ctx.translate(0, -43);
        ctx.fillStyle = '#4CC9F0';
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1B4998';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#64748B';
        ctx.beginPath();
        ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();
    },

    drawCape(x, y) {
        ctx.save();
        ctx.translate(x, y);

        // Пиксельная трапеция плаща - шире и выше, видна по бокам бургера
        const rows = [
            [-18, 14], [-15, 16], [-12, 18], [-9, 20], [-6, 22],
            [-3, 24], [0, 26], [3, 27], [6, 28], [9, 29],
            [12, 29], [15, 28], [18, 26], [21, 23]
        ];
        const rowH = 3;
        const trim = 3;

        // Бархатное полотно с чередованием оттенка для пиксельной фактуры
        for (let i = 0; i < rows.length; i++) {
            const [ry, hw] = rows[i];
            ctx.fillStyle = (i % 3 === 0) ? '#A31E22' : '#C92A2A';
            ctx.fillRect(-hw, ry, hw * 2, rowH);
        }

        // Тёмные вертикальные складки бархата
        ctx.fillStyle = 'rgba(0,0,0,0.16)';
        [-20, -7, 7, 20].forEach(fx => {
            ctx.fillRect(fx, -16, 4, 42);
        });

        // Блики бархата
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        [-13, 0, 13].forEach(fx => {
            ctx.fillRect(fx, -14, 2, 40);
        });

        // Далматиновая опушка-воротник сверху (белые пиксели с чёрными пятнами)
        const collarHw = rows[0][1];
        for (let i = -collarHw; i < collarHw; i += trim) {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(i, -21, trim, trim);
        }
        ctx.fillStyle = '#1A1A1A';
        ctx.fillRect(-collarHw + 3, -20, 2, 2);
        ctx.fillRect(-1, -20, 2, 2);
        ctx.fillRect(collarHw - 5, -20, 2, 2);

        // Далматиновая окантовка по обеим сторонам, повторяет форму плаща
        rows.forEach(([ry, hw], i) => {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(-hw - trim, ry, trim, rowH);
            ctx.fillRect(hw, ry, trim, rowH);

            if (i % 2 === 0) {
                ctx.fillStyle = '#1A1A1A';
                ctx.fillRect(-hw - trim + 1, ry + 1, 1, 1);
                ctx.fillRect(hw + 1, ry + 1, 1, 1);
            }
        });

        // Нижняя далматиновая окантовка (подол)
        const [lastY, lastHw] = rows[rows.length - 1];
        for (let i = -lastHw; i < lastHw; i += trim) {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(i, lastY + rowH, trim, trim);
        }
        ctx.fillStyle = '#1A1A1A';
        for (let i = -lastHw + 3; i < lastHw - 2; i += 6) {
            ctx.fillRect(i + 1, lastY + rowH + 1, 1, 1);
        }

        ctx.restore();
    },

    draw(overrideX, overrideY, isSad = false, skinKey = selectedSkin) {
        ctx.save();
        ctx.translate(overrideX !== undefined ? overrideX : this.x, overrideY !== undefined ? overrideY : this.y);
        if (overrideX === undefined) ctx.rotate(this.rotation);

        const skin = SKINS[skinKey] || SKINS.default;

        // Плащ Короля рисуется первым - позади самого бургера
        if (skin.hasCape) {
            this.drawCape(0, 0);
        }

        // --- RGB-эффект (скин Алхимик): цвет самой булочки переливается ---
        let topBunColor = skin.topBun;
        let botBunColor = skin.botBun;
        let strokeColor = skin.stroke;
        let seedColor = skin.seed;

        if (skin.rgbEffect) {
            const ac = getAlchemyColor();
            topBunColor = `rgb(${ac.r}, ${ac.g}, ${ac.b})`;
            botBunColor = `rgb(${Math.round(ac.r * 0.8)}, ${Math.round(ac.g * 0.8)}, ${Math.round(ac.b * 0.8)})`;
            strokeColor = `rgb(${Math.round(ac.r * 0.4)}, ${Math.round(ac.g * 0.4)}, ${Math.round(ac.b * 0.4)})`;
            seedColor = '#FFFFFF';

            // мягкая цветная аура позади бургера, пульсирует вместе с "бульканьем"
            const pulse = Math.abs(Math.sin(menuAnimTime * 3));
            const glow = ctx.createRadialGradient(0, -4, 4, 0, -4, 30 + pulse * 4);
            glow.addColorStop(0, `rgba(${ac.r}, ${ac.g}, ${ac.b}, 0.35)`);
            glow.addColorStop(1, `rgba(${ac.r}, ${ac.g}, ${ac.b}, 0)`);
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, -4, 30 + pulse * 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Bottom Bun
        ctx.fillStyle = botBunColor;
        ctx.beginPath();
        ctx.roundRect(-20, 4, 40, 14, [4, 4, 8, 8]);
        ctx.fill();
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Patty
        ctx.fillStyle = '#592E1B';
        ctx.fillRect(-22, -1, 44, 7);
        ctx.strokeStyle = '#381C10';
        ctx.strokeRect(-22, -1, 44, 7);

        // Cheese
        ctx.fillStyle = '#F2CB05';
        ctx.beginPath();
        ctx.moveTo(-18, -1);
        ctx.lineTo(18, -1);
        ctx.lineTo(14, 5);
        ctx.lineTo(-8, 5);
        ctx.closePath();
        ctx.fill();

        // Top bun
        ctx.fillStyle = topBunColor;
        ctx.beginPath();
        ctx.roundRect(-22, -18, 44, 18, [14, 14, 4, 4]);
        ctx.fill();
        ctx.strokeStyle = strokeColor;
        ctx.stroke();

        // Seeds
        ctx.fillStyle = seedColor;
        ctx.fillRect(-10, -13, 3, 2);
        ctx.fillRect(6, -11, 3, 2);
        ctx.fillRect(-2, -9, 3, 2);

        // Шляпа бизнесмена
        if (skin.hasHat) {
            ctx.fillStyle = '#1A1A1A';
            ctx.beginPath();
            ctx.ellipse(0, -17, 20, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#262626';
            ctx.beginPath();
            ctx.roundRect(-11, -34, 22, 17, [3, 3, 0, 0]);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#E53E3E';
            ctx.fillRect(-11, -21, 22, 4);

            drawBusinessSuit(0, 0);
        }

        // Корона Короля
        if (skin.hasCrown) {
            drawPixelCrown(0, -17);
        }

        // Шляпа Шеф-повара
        if (skin.hasChefHat) {
            this.drawChefHat(0, 0);
        }

        // Кепка детсадовца с пропеллером
        if (skin.hasPropellerCap) {
            this.drawPropellerCap(0, 2);
        }

        if (skin.hasCowboyHat) {
            drawCowboyHat(0, 0);
        }

        // Гаваец: рубашка, панама и пиксельные очки
        if (skin.hasHawaiian) {
            drawHawaiianShirt(0, 0);
            drawBucketHat(0, 0);
            drawPixelSunglasses(0, -6);
        }

        // Полицейский: форма на нижней булке и фуражка на голове
        if (skin.hasPoliceUniform) {
            drawPoliceUniform(0, 0);
        }
        if (skin.hasPoliceHat) {
            drawPoliceHat(0, 0);
        }

        if (isSad) {
            ctx.strokeStyle = '#1A1A1A';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(-4, -4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(-10, -4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(4, -10); ctx.lineTo(10, -4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(10, -10); ctx.lineTo(4, -4); ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 3, 4, Math.PI, 0);
            ctx.stroke();
        } else {
            ctx.fillStyle = '#1A1A1A';
            ctx.fillRect(-9, -8, 4, 6);
            ctx.fillRect(5, -8, 4, 6);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(-8, -7, 2, 2);
            ctx.fillRect(6, -7, 2, 2);

            ctx.fillStyle = '#FF8FA3';
            ctx.fillRect(-14, -2, 5, 3);
            ctx.fillRect(9, -2, 5, 3);

            ctx.strokeStyle = '#1A1A1A';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -3, 3, 0, Math.PI);
            ctx.stroke();
        }

        ctx.restore();
    }
};

class ObstacleManager {
    constructor() {
        this.list = [];
        this.dollars = [];
        this.spawnTimer = 0;
        this.spawnInterval = 100;
        this.speed = 3;
        this.width = 46;
        this.gap = 130;
    }

    reset() {
        this.list = [];
        this.dollars = [];
        this.spawnTimer = 0;
    }

    update() {
        if (gameState !== STATES.PLAYING) return;

        this.spawnTimer++;
        if (this.spawnTimer >= this.spawnInterval) {
            this.spawnTimer = 0;
            this.spawn();
        }

        for (let i = this.list.length - 1; i >= 0; i--) {
            let obs = this.list[i];
            obs.x -= this.speed;

            if (!obs.passed && obs.x + this.width < burger.x) {
                obs.passed = true;
                score++;
            }

            if (obs.x + this.width < 0) {
                this.list.splice(i, 1);
            }

            const burgerBox = {
                left: burger.x - burger.radius + 2,
                right: burger.x + burger.radius - 2,
                top: burger.y - burger.radius + 2,
                bottom: burger.y + burger.radius - 2
            };

            if (burgerBox.right > obs.x && burgerBox.left < obs.x + this.width) {
                if (burgerBox.top < obs.topHeight || burgerBox.bottom > obs.bottomY) {
                    gameOver();
                }
            }
        }

        for (let i = this.dollars.length - 1; i >= 0; i--) {
            let d = this.dollars[i];
            d.x -= this.speed;

            d.animTime += 0.05;
            d.currentY = d.y + Math.sin(d.animTime) * 8;

            const dist = Math.hypot(burger.x - d.x, burger.y - d.currentY);
            if (dist < burger.radius + 12) {
                money++;
                localStorage.setItem('burger_money', money);
                music.playCoinSFX();
                this.dollars.splice(i, 1);
                continue;
            }

            if (d.x < -20) {
                this.dollars.splice(i, 1);
            }
        }
    }

    spawn() {
        const minHeight = 60;
        const maxHeight = GAME_H - this.gap - minHeight;
        const topHeight = Math.floor(Math.random() * (maxHeight - minHeight)) + minHeight;
        const bottomY = topHeight + this.gap;

        this.list.push({
            x: GAME_W,
            topHeight: topHeight,
            bottomY: bottomY,
            width: this.width,
            passed: false
        });

        if (Math.random() < 0.7) {
            this.dollars.push({
                x: GAME_W + this.width / 2,
                y: topHeight + this.gap / 2,
                animTime: Math.random() * Math.PI,
                currentY: topHeight + this.gap / 2
            });
        }
    }

    drawSpatula(x, y, height, isTop) {
        ctx.save();
        ctx.translate(x, y);

        const width = this.width;
        const headHeight = 70;

        if (isTop) {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(width / 2 - 5, 0, 10, height - headHeight);
            ctx.strokeStyle = '#5A2A0C';
            ctx.strokeRect(width / 2 - 5, 0, 10, height - headHeight);

            ctx.fillStyle = '#CBD5E0';
            ctx.fillRect(0, height - headHeight, width, headHeight);
            ctx.strokeStyle = '#718096';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, height - headHeight, width, headHeight);

            ctx.fillStyle = '#4A5568';
            ctx.fillRect(8, height - headHeight + 15, 6, 40);
            ctx.fillRect(20, height - headHeight + 15, 6, 40);
            ctx.fillRect(32, height - headHeight + 15, 6, 40);

            ctx.fillStyle = '#E2E8F0';
            ctx.fillRect(0, height - 6, width, 6);
        } else {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(width / 2 - 5, headHeight, 10, height - headHeight);
            ctx.strokeStyle = '#5A2A0C';
            ctx.strokeRect(width / 2 - 5, headHeight, 10, height - headHeight);

            ctx.fillStyle = '#CBD5E0';
            ctx.fillRect(0, 0, width, headHeight);
            ctx.strokeStyle = '#718096';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, width, headHeight);

            ctx.fillStyle = '#4A5568';
            ctx.fillRect(8, 15, 6, 40);
            ctx.fillRect(20, 15, 6, 40);
            ctx.fillRect(32, 15, 6, 40);

            ctx.fillStyle = '#E2E8F0';
            ctx.fillRect(0, 0, width, 6);
        }

        ctx.restore();
    }

    draw() {
        for (let obs of this.list) {
            this.drawSpatula(obs.x, 0, obs.topHeight, true);
            this.drawSpatula(obs.x, obs.bottomY, GAME_H - obs.bottomY, false);
        }

        for (let d of this.dollars) {
            drawDollarBill(d.x, d.currentY, 1.2);
        }
    }
}

const obstacles = new ObstacleManager();

function drawBackground() {
    if (gameState === STATES.START) {
        // Мягкий вертикальный градиент вместо плоской заливки - выглядит
        // гораздо приятнее и менее "пусто" на большом экране.
        const bgGrad = ctx.createLinearGradient(0, 0, 0, GAME_H);
        bgGrad.addColorStop(0, '#FFFAF0');
        bgGrad.addColorStop(0.5, '#FFEFD6');
        bgGrad.addColorStop(1, '#F7DBAE');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, GAME_W, GAME_H);

        // Крупные декоративные круги по краям - минималистичная глубина.
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#FFE2B0';
        ctx.beginPath();
        ctx.arc(GAME_W + 60, 30, 190, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#FFD9A0';
        ctx.beginPath();
        ctx.arc(-60, GAME_H * 0.4, 160, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Мягкое свечение-"спотлайт" позади бургера, чтобы взгляд сразу
        // притягивался к персонажу по центру экрана.
        const glowY = 260 + Math.sin(menuAnimTime * 1.5) * 10;
        const glow = ctx.createRadialGradient(GAME_W / 2, glowY, 10, GAME_W / 2, glowY, 170);
        glow.addColorStop(0, 'rgba(255, 190, 100, 0.6)');
        glow.addColorStop(1, 'rgba(255, 190, 100, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, GAME_W, GAME_H);

        const shelfY = 460;
        ctx.fillStyle = '#E6C5A4';
        ctx.fillRect(0, shelfY, GAME_W, 14);
        ctx.fillStyle = '#C49A70';
        ctx.fillRect(0, shelfY + 14, GAME_W, 6);
        // тонкая тень под полкой - добавляет объёма без лишней детализации
        const shelfShadow = ctx.createLinearGradient(0, shelfY, 0, shelfY + 24);
        shelfShadow.addColorStop(0, 'rgba(0,0,0,0.06)');
        shelfShadow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = shelfShadow;
        ctx.fillRect(0, shelfY, GAME_W, 24);

        const offsetX = Math.sin(menuAnimTime * 0.8) * 12;

        ctx.fillStyle = '#E57373';
        ctx.fillRect(60 + offsetX, shelfY - 35, 18, 35);
        ctx.fillStyle = '#FFF176';
        ctx.fillRect(90 + offsetX, shelfY - 40, 20, 40);

        ctx.fillStyle = '#A1887F';
        ctx.fillRect(290 - offsetX, shelfY - 30, 22, 30);
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(288 - offsetX, shelfY - 36, 26, 6);

        ctx.fillStyle = '#D4A373';
        parallaxSeeds.forEach(seed => {
            seed.y += seed.speed;
            seed.x += Math.sin(menuAnimTime + seed.y * 0.05) * 0.5;

            if (seed.y > GAME_H) {
                seed.y = -10;
                seed.x = Math.random() * GAME_W;
            }

            ctx.save();
            ctx.translate(seed.x, seed.y);
            ctx.rotate(seed.rot);
            ctx.beginPath();
            ctx.ellipse(0, 0, seed.size, seed.size * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

    } else if (gameState === STATES.SHOP) {
        ctx.fillStyle = '#322016';
        ctx.fillRect(0, 0, GAME_W, GAME_H);
    } else {
        const targetIndex = Math.floor(score / 5) % pastelColors.length;
        const targetColor = pastelColors[targetIndex];

        currentBg.r = lerp(currentBg.r, targetColor.r, 0.03);
        currentBg.g = lerp(currentBg.g, targetColor.g, 0.03);
        currentBg.b = lerp(currentBg.b, targetColor.b, 0.03);

        // Вертикальный градиент вместо плоского цвета - светлее сверху,
        // заметно темнее снизу, даёт ощущение глубины во время игры.
        const top = shadeColor(currentBg, 14);
        const bottom = shadeColor(currentBg, -30);
        const grad = ctx.createLinearGradient(0, 0, 0, GAME_H);
        grad.addColorStop(0, `rgb(${Math.round(top.r)}, ${Math.round(top.g)}, ${Math.round(top.b)})`);
        grad.addColorStop(1, `rgb(${Math.round(bottom.r)}, ${Math.round(bottom.g)}, ${Math.round(bottom.b)})`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, GAME_W, GAME_H);

        // Минималистичные слоистые горы (см. drawMountains выше) - цвет
        // берётся от текущего фона, поэтому гамма гор меняется вместе с
        // фоном каждые 5 очков.
        drawMountains(currentBg);

        // Лёгкая виньетка по краям - мягко затемняет углы, взгляд
        // концентрируется в центре игрового поля.
        const vignette = ctx.createRadialGradient(GAME_W / 2, GAME_H / 2, GAME_H * 0.35, GAME_W / 2, GAME_H / 2, GAME_H * 0.75);
        vignette.addColorStop(0, 'rgba(0,0,0,0)');
        vignette.addColorStop(1, 'rgba(0,0,0,0.12)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, GAME_W, GAME_H);
    }
}

function drawShopIcon(x, y) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#FFF0D9';
    ctx.beginPath();
    ctx.roundRect(0, 0, 42, 32, 8);
    ctx.fill();
    ctx.strokeStyle = '#D4A373';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#F5D0A9';
    ctx.fillRect(10, 14, 22, 13);
    ctx.strokeStyle = '#5C3C28';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(10, 14, 22, 13);

    ctx.fillStyle = '#5C3C28';
    ctx.fillRect(22, 19, 7, 8);
    ctx.fillStyle = '#A0C4FF';
    ctx.fillRect(13, 17, 6, 6);

    const stripeW = 5.5;
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = (i % 2 === 0) ? '#E53E3E' : '#FFFFFF';
        ctx.beginPath();
        ctx.roundRect(9 + i * stripeW, 8, stripeW + 0.5, 7, [2, 2, 0, 0]);
        ctx.fill();
    }
    ctx.strokeStyle = '#5C3C28';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(9, 8, 24, 7);

    ctx.restore();
}

function drawPlate(centerX, centerY, burgerY) {
    ctx.save();

    ctx.fillStyle = 'rgba(70, 40, 20, 0.25)';
    ctx.beginPath();
    ctx.ellipse(centerX, centerY + 14, 72, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#CBD5E1';
    ctx.beginPath();
    ctx.ellipse(centerX, centerY + 5, 76, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#F8FAFC';
    ctx.beginPath();
    ctx.ellipse(centerX, centerY, 76, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#2C7A7B';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(centerX, centerY, 70, 17.5, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#EDF2F7';
    ctx.beginPath();
    ctx.ellipse(centerX, centerY, 58, 13.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#CBD5E1';
    ctx.lineWidth = 1;
    ctx.stroke();

    const shadowScale = 1 - (175 - burgerY) * 0.02;
    ctx.fillStyle = 'rgba(44, 62, 80, 0.25)';
    ctx.beginPath();
    ctx.ellipse(centerX, centerY + 1, 26 * shadowScale, 7 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawExitButton() {
    ctx.save();
    ctx.fillStyle = '#FFF0D9';
    ctx.beginPath();
    ctx.roundRect(12, 12, 42, 32, 8);
    ctx.fill();
    ctx.strokeStyle = '#D4A373';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.translate(20, 18);

    ctx.strokeStyle = '#5C3C28';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.moveTo(14, 5);
    ctx.lineTo(14, 2);
    ctx.lineTo(2, 2);
    ctx.lineTo(2, 18);
    ctx.lineTo(14, 18);
